.check button[aria-pressed="true"] .t{color:var(--ink3);text-decoration:line-through}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:7px 12px;font-weight:500;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:none}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}

.days button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.days button.today small::after{content:" · วันนี้";color:var(--accent)}
.ex{display:grid;grid-template-columns:92px 1fr;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface2)}

.ex .fig svg{width:100%;height:auto;display:block}
.ex h3{font-size:15px}
.sr{font-family:var(--f-num);color:var(--accent);font-weight:600}
.hint{font-size:12.5px;border-radius:8px;padding:5px 8px;background:var(--ok-soft);color:var(--ok)}
.hint.same{background:var(--chip);color:var(--ink2)}
.sets{display:grid;gap:6px;margin-top:6px}
.setrow{display:grid;grid-template-columns:42px 1fr 1fr;gap:6px;align-items:center}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
label.f{display:grid;gap:4px;font-size:13px;color:var(--ink2);font-weight:500}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--ink3);font-weight:600;font-size:12px}
.tw{overflow-x:auto}
.advice{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:0 10px 10px 0;padding:10px 12px}

.chart svg{width:100%;height:auto;display:block}
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,16,32,.55);display:flex;align-items:flex-end;justify-content:center}

.rdoc{--ink:#14213d;--ink2:#4a5672;--ink3:#6b7489;--line:#d9dfe9;--soft:#f3f6fa;--acc:#e85d04;--ok:#2a9d8f;--bad:#c1121f;
  width:760px;margin:0 auto;background:#fff;color:var(--ink);font-family:var(--f-body);font-size:12.5px;line-height:1.5;padding:36px 40px;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.rdoc h2 small{font-family:var(--f-body);font-size:11px;color:var(--ink3);font-weight:400}

.rdoc table{width:100%;border-collapse:collapse;font-size:11.5px}

.rdoc td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}

.rhead{background:#14213d;color:#fff;border-radius:12px;padding:20px 22px;display:grid;gap:6px}

.rnote{font-size:10.5px;color:var(--ink3);margin:5px 0 0}
.radv{border-left:4px solid var(--acc);background:#fff4ec;padding:8px 12px;border-radius:0 8px 8px 0;margin-top:8px}
.rgrid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rdoc .rfig{width:54px}
.rdoc .rfig svg{width:54px;height:auto;display:block;background:#f6f8fb;border:1px solid var(--line);border-radius:6px}
.rdoc ul{margin:0;padding-left:18px}
.rfoot{font-size:10px;color:var(--ink3);text-align:center;padding-top:6px}
.rprog{color:#fff;font-size:13px;text-align:center}
@media print{
  @page{size:A4;margin:12mm}
  body.printing > *:not(#report){display:none !important}
  body.printing{background:#fff !important}
  body.printing::before{display:none}
  body.printing #report{display:block !important;position:static !important;background:#fff !important;padding:0 !important;overflow:visible !important}
  body.printing .rbar{display:none !important}
  body.printing .rdoc{width:auto;padding:0;margin:0;zoom:1 !important}
  .rsec{break-inside:avoid}
  .rsec.long{break-inside:auto}
  .rdoc tr{break-inside:avoid}
}

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r0 = x => Math.round(x), r5 = x => Math.round(x/5)*5, r10 = x => Math.round(x/10)*10, r50=x=>Math.round(x/50)*50;
const fmt = x => Math.round(x).toLocaleString("en-US");
const ymd = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const today = () => ymd(new Date());
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a,b) => Math.round((parseD(b)-parseD(a))/86400000);
const TH_DAYS = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัส","ศุกร์","เสาร์"];
const TH_SHORT = ["อา.","จ.","อ.","พ.","พฤ.","ศ.","ส."];
const thDate = s => { const d=parseD(s); return d.getDate()+" "+["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."][d.getMonth()]; };

/* ---------- state + storage ---------- */
const DEFAULT_PROFILE = {
  name:"", sex:"m", age:30, height:170, weight:70, bf:null, waist:null,
  goal:"fat", pace:"normal", days:4, level:"begin", equip:"gym", session:"evening",
  mealMode:"office", lactose:false,
  wheyName:"เวย์โปรตีน", wheyP:25, wheyK:120, wheyServ:60,
  creatineLoad:false, weeks:12, start:new Date().toISOString().slice(0,10), coffee:1, focus:"balanced", limit:"none"
};
const S = { profile:{...DEFAULT_PROFILE}, days:{}, picks:{}, dayType:null, tab:"today", trainSel:null, logOpen:{}, confirmReset:false, trackDate:null };
let DB=null, UID=null, online=false;
const LKEY="blueprint-coach-v1";
function loadLocal(){ try{ const j = JSON.parse(localStorage.getItem(LKEY)||"null"); if(j){ if(j.profile) S.profile={...DEFAULT_PROFILE,...j.profile}; if(j.days) S.days=j.days; if(j.picks) S.picks=j.picks; return !!j.profile; } }catch(e){} return false; }
function saveLocal(){ try{ localStorage.setItem(LKEY, JSON.stringify({profile:S.profile, days:S.days, picks:S.picks})); }catch(e){} }
const timers={};
function debounce(key, fn, ms=700){ clearTimeout(timers[key]); timers[key]=setTimeout(fn, ms); }
function saveProfile(){ saveLocal(); if(online) debounce("profile", ()=> DB.doc("data/users/"+UID+"/profile").set({profile:S.profile, picks:S.picks}).catch(syncErr)); }
function saveDay(d){ saveLocal(); if(online) debounce("day-"+d, ()=> DB.doc("data/users/"+UID+"/profile").collection("days").doc(d).set(S.days[d]||{}).catch(syncErr)); }
function syncErr(){ online=false; setSync(); }
function setSync(){ $("#syncdot").classList.toggle("on", online); $("#synctxt").textContent = online ? "บันทึกในบัญชีของคุณ" : "บันทึกในเครื่องนี้"; }
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    DB=db; UID=id;
    const pref = DB.doc("data/users/"+UID+"/profile");
    const ps = await pref.get();
    if(ps.exists){ const d=ps.data()||{}; if(d.profile){ S.profile={...DEFAULT_PROFILE,...d.profile}; S.hasProfile=true; } if(d.picks) S.picks={...d.picks}; }
    const qs = await pref.collection("days").limit(1000).get();
    qs.docs.forEach(doc=>{ S.days[doc.id] = JSON.parse(JSON.stringify(doc.data()||{})); });
    online=true; setSync();
    // first time online: push local data up
    if(!ps.exists && S.hasProfile){ await pref.set({profile:S.profile, picks:S.picks}); for(const d of Object.keys(S.days)) await pref.collection("days").doc(d).set(S.days[d]); }
    saveLocal(); render();
  }catch(e){ online=false; setSync(); }
}
const day = d => (S.days[d] ||= {});

/* ---------- calculations ---------- */
function calc(p){
  const w=+p.weight||70, h=+p.height||170, a=+p.age||30, bf=+p.bf||0, male=p.sex!=="f";
  const lbm = bf>3 && bf<60 ? w*(1-bf/100) : null;
  const mifflin = 10*w + 6.25*h - 5*a + (male?5:-161);
  const bmr = lbm ? 370 + 21.6*lbm : mifflin;
  const days=+p.days||4;
  const act = {2:1.3,3:1.375,4:1.45,5:1.5,6:1.55}[days] || 1.45;
  const tdee = bmr*act;
  const paceAdj = G(p).adj[p.pace] ?? 0;
  let target = tdee*(1+paceAdj);
  const floor = Math.max(bmr, male?1500:1200);
  if(target<floor) target=floor;
  const rest = days>=7 ? target : target-150;
  const train = days>=7 ? target : (7*target - (7-days)*rest)/days;
  const bmi = w/((h/100)**2);
  const protW = (bmi>30 && !lbm) ? (h-100) : w;   // adjusted weight for high BMI without BF
  const protPerKg = G(p).prot;
  const protein = lbm ? Math.min(protPerKg*w, 2.8*lbm) : protPerKg*protW;
  const macros = k => { const P=protein; const F=Math.max(0.6*w, k*0.27/9); const C=Math.max(0,(k-P*4-F*9)/4); return {k, P, C, F}; };
  const water = w*0.035 + 0.5;
  const hrMax = 220-a;
  const weeklyKg = (target - tdee)*7/7700;
  const capWeekly = G(p).kind==="cut" ? Math.max(weeklyKg, -0.01*w) : weeklyKg;
  const weeks=+p.weeks||12;
  let endW = w + capWeekly*weeks;
  let tgtBFw=null;
  if(lbm && (G(p).kind==="cut"||G(p).kind==="recomp")){ const tbf = male?15:24; tgtBFw = lbm/(1-tbf/100); }
  return { w,h,a,bf,male,lbm,bmr,mifflin,act,tdee,target,train,rest,protein,bmi,water,hrMax,
    z2:[r5(hrMax*.6), r5(hrMax*.7)], weeklyKg:capWeekly, endW, weeks, tgtBFw,
    trainM:macros(train), restM:macros(rest), method: lbm?"Katch-McArdle (ใช้ % ไขมัน)":"Mifflin-St Jeor" };
}
function progWeek(p){ const n = diffDays(p.start, today()); return Math.floor(n/7)+1; }
function deloadWeek(p){ return (+p.weeks>=10) ? Math.round(+p.weeks*0.58) : null; }

  yogurt:{n:"กรีกโยเกิร์ตไขมันต่ำ",u:"g",per:100,k:60,P:10,C:4,F:.4,step:25,min:100,lact:1},

const TPL = {

function cardioRx(p, kind){

  if(kind==="post") return `ลู่วิ่งชัน / Stairmaster Zone 2 (ชีพจร ${z[0]}–${z[1]}) · ${post} นาที หลังเวท`;
  if(kind==="C") return g==="fitness" ? `ลู่วิ่ง/จักรยาน: วอร์ม 10 นาที → เร็ว 1 นาที / ช้า 2 นาที × 8 รอบ → Zone 2 (${z[0]}–${z[1]}) ให้ครบ ${full} นาที`
    : `ลู่วิ่งชัน 8–12 · 4.5–5.5 กม./ชม. Zone 2 (${z[0]}–${z[1]} ครั้ง/นาที) · ${full} นาที ห้ามจับราว`;

const EMPH={vshape:["side","vpull","rear"],chest_arms:["chest","tri","bi"],glutes:["glute"],legs:["squat","quad","ham"],core:["core"],posture:["row","rear"]};
function rxFor(p, k, idx){
  const e=DATA.ex[k]; let s=e.s, r=e.r; const kind=G(p).kind;
  if(kind==="gain"){ if(e.t==="c") r = idx===0 ? "6–8" : "8–10"; else if(e.t==="i") r="10–15"; }
  if(kind==="strength"){ if(e.t==="c") r = idx===0 ? "4–6" : "6–8"; else if(e.t==="i") r="10–12"; }
  if(p.goal==="tone"||kind==="fitness"){ if(e.t==="c") r="10–15"; else if(e.t==="i") r="12–20"; }
  if((kind==="gain"||kind==="strength") && e.t==="c" && idx<2) s+=1;
  if((kind==="maintain"||kind==="fitness") && e.t==="i") s=Math.max(2,s-1);
  const em=EMPH[p.focus]; if(em && em.some(c=>(POOL[c]||[]).includes(k))) s+=1;
  if(p.level==="begin") s=Math.max(2,s-1);
  if(p.level==="adv" && idx===0) s+=1;
  s=Math.min(5,s);
  const wk=progWeek(p), dl=deloadWeek(p);
  if(dl && wk===dl) s=Math.max(2,Math.ceil(s/2));
  if(p.level==="begin" && wk<=2) s=Math.min(s,3);
  return {s, r};
}
function topRep(r){ const m=String(r).match(/(\d+)\s*(?:–|-)\s*(\d+)/); return m?+m[2]:(+String(r).match(/\d+/)?.[0]||0); }

  if(!ds.length) return null; const d=ds[ds.length-1]; return {d, sets:S.days[d].lifts[k]};
}

function trend(){
  const ds=Object.keys(S.days).filter(d=>S.days[d].w).sort();
  const vals=ds.map(d=>({d,w:+S.days[d].w}));
  const t=today();
  const win=(a,b)=>{ const v=vals.filter(x=>x.d>a && x.d<=b).map(x=>x.w); return v.length?v.reduce((s,x)=>s+x,0)/v.length:null; };
  const avg7=win(addDays(t,-7),t), prev7=win(addDays(t,-14),addDays(t,-7));
  return {vals, avg7, prev7, rate:(avg7!=null&&prev7!=null)?avg7-prev7:null, n:vals.length, span: vals.length?diffDays(vals[0].d, vals[vals.length-1].d):0};
}

function exCard(p,k,i,date){

function chart(p,c,tr){
  const W=520,H=260,L=40,R=14,T=14,B=28;
  const start=p.start, end=addDays(start, (+p.weeks)*7);
  const pts=tr.vals.filter(v=>v.d>=addDays(start,-14));
  const all=[...pts.map(x=>x.w), +p.weight, c.endW];
  let lo=Math.floor(Math.min(...all)-1), hi=Math.ceil(Math.max(...all)+1);
  const x0=parseD(addDays(start,-3)), x1=parseD(end);
  const X=d=>L+(parseD(d)-x0)/(x1-x0)*(W-L-R), Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const ticks=[]; const st=Math.max(1,Math.ceil((hi-lo)/5)); for(let v=lo; v<=hi; v+=st) ticks.push(v);
  const avg=pts.map((x,i)=>{ const win=pts.filter(y=>y.d<=x.d && y.d>addDays(x.d,-7)); return {d:x.d, w:win.reduce((s,y)=>s+y.w,0)/win.length}; });
  const path=a=>a.map((x,i)=>(i?"L":"M")+X(x.d).toFixed(1)+","+Y(x.w).toFixed(1)).join("");
  const xt=[]; for(let i=0;i<=+p.weeks;i+=Math.max(1,Math.round(+p.weeks/6))) xt.push(i);
  const td=today();
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟน้ำหนัก">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="13" fill="var(--ink3)" font-family="IBM Plex Mono,monospace">${v}</text>`).join("")}
    ${xt.map(i=>`<text x="${X(addDays(start,i*7))}" y="${H-8}" text-anchor="middle" font-size="13" fill="var(--ink3)">W${i}</text>`).join("")}
    <line x1="${X(start)}" y1="${Y(+p.weight)}" x2="${X(end)}" y2="${Y(c.endW)}" stroke="var(--gold)" stroke-width="2" stroke-dasharray="6 5"/>
    ${td>=start&&td<=end?`<line x1="${X(td)}" x2="${X(td)}" y1="${T}" y2="${H-B}" stroke="var(--ink3)" stroke-width="1" stroke-dasharray="2 3"/>`:""}
    ${pts.map(x=>`<circle cx="${X(x.d)}" cy="${Y(x.w)}" r="3" fill="var(--ink3)" opacity=".7"/>`).join("")}
    ${avg.length>1?`<path d="${path(avg)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`:""}
    ${avg.length?`<circle cx="${X(avg[avg.length-1].d)}" cy="${Y(avg[avg.length-1].w)}" r="5" fill="var(--accent)"/>`:""}
    ${!pts.length?`<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="13" fill="var(--ink3)">บันทึกน้ำหนักวันแรกเพื่อเริ่มกราฟ</text>`:""}
  </svg>`;
}

/* ---------- body-composition scans (Evolt / InBody) ---------- */
const SCAN_FIELDS=[
 ["weight","น้ำหนัก","kg",30,250,[/body\s*weight/,/\bweight\b/,/น้ำหนัก/]],
 ["smm","มวลกล้ามเนื้อ (SMM)","kg",10,80,[/skeletal\s*muscle\s*mass/,/\bsmm\b/,/muscle\s*mass/,/มวลกล้ามเนื้อ/]],
 ["fatMass","มวลไขมัน","kg",1,120,[/body\s*fat\s*mass/,/\bfat\s*mass\b/,/มวลไขมัน/]],
 ["bf","% ไขมัน","%",3,60,[/(?:percent(?:age)?\s*(?:of\s*)?body\s*fat|body\s*fat\s*(?:percent(?:age)?|%))/,/\bpbf\b/,/body\s*fat(?!\s*mass)/,/เปอร์เซ็นต์ไขมัน|%\s*ไขมัน/]],
 ["lbm","มวลไร้ไขมัน","kg",20,150,[/lean\s*body\s*mass/,/fat\s*free\s*mass/,/lean\s*mass/,/\b(?:lbm|ffm)\b/,/มวลไร้ไขมัน/]],
 ["tbw","น้ำในร่างกาย","L",15,90,[/total\s*body\s*water/,/\btbw\b/,/body\s*water/,/น้ำในร่างกาย/]],
 ["visceral","ไขมันช่องท้อง (ระดับ)","",1,30,[/visceral\s*fat\s*level/,/visceral\s*(?:fat\s*)?(?:rating|level)/,/visceral\s*fat(?!\s*area)/,/ไขมันในช่องท้อง/]],
 ["vfa","พื้นที่ไขมันช่องท้อง","cm²",10,400,[/visceral\s*fat\s*area/,/\bvfa\b/]],
 ["torsoFat","ไขมันลำตัว","kg",1,60,[/(?:torso|trunk)\s*fat(?:\s*mass)?/,/ไขมันลำตัว/]],
 ["bmr","BMR","kcal",800,4000,[/basal\s*metabolic\s*rate/,/\bbmr\b/,/อัตราการเผาผลาญ/]],
 ["bwi","BWI","",0,10,[/body\s*wellness\s*index/,/\bbwi\b/]],
 ["waist","รอบเอว","cm",40,200,[/waist(?:\s*circumference)?/,/รอบเอว/]]
];
function parseScanText(raw){
  const t=String(raw||"").toLowerCase().replace(/(\d),(\d{3})\b/g,"$1$2").replace(/(\d),(\d)/g,"$1.$2").replace(/[ \t]+/g," ");
  const out={};
  for(const [k,,,lo,hi,res] of SCAN_FIELDS){
    for(const re of res){ const g=new RegExp(re.source,"g"); let m, hit=null;
      while((m=g.exec(t))){ const after=t.slice(m.index+m[0].length, m.index+m[0].length+70);
        const nums=[...after.matchAll(/-?\d+(?:\.\d+)?/g)].map(x=>+x[0]); const v=nums.find(n=>n>=lo&&n<=hi); if(v!=null){ hit=v; break; } }
      if(hit!=null){ out[k]=hit; break; } }
  }
  const r=fixScan(out);
  let dm=t.match(/(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})/), d=null;
  if(dm) d=[dm[1],dm[2],dm[3]]; else if((dm=t.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](20\d{2})\b/))) d=[dm[3],dm[2],dm[1]];
  if(d){ const iso=d[0]+"-"+String(d[1]).padStart(2,"0")+"-"+String(d[2]).padStart(2,"0"); if(+d[1]>=1&&+d[1]<=12&&+d[2]>=1&&+d[2]<=31&&iso<=today()) r._date=iso; }
  return r;
}
function fixScan(o){
  const r={}; for(const [k,,,lo,hi] of SCAN_FIELDS){ const v=parseFloat(o[k]); if(isFinite(v)&&v>=lo&&v<=hi) r[k]=Math.round(v*100)/100; }
  if(r.weight&&r.fatMass&&!r.bf) r.bf=Math.round(r.fatMass/r.weight*1000)/10;
  if(r.weight&&r.bf&&!r.fatMass) r.fatMass=Math.round(r.weight*r.bf/10)/100;
  if(r.weight&&r.fatMass&&!r.lbm) r.lbm=Math.round((r.weight-r.fatMass)*100)/100;
  return r;
}
async function pdfToInputs(file){
  if(!window.pdfjsLib) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }catch(e){}
  const doc=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  let text=""; const imgs=[];
  for(let i=1;i<=Math.min(doc.numPages,3);i++){ const pg=await doc.getPage(i);
    const tc=await pg.getTextContent(); text+=tc.items.map(x=>x.str).join(" ")+"\n";
    const vp=pg.getViewport({scale:2}); const cv=document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height;
    await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
    imgs.push(await new Promise(ok=>cv.toBlob(ok,"image/png"))); }
  return {text, imgs};
}
async function prepOCR(blob){ // upscale small images + grayscale/contrast for better OCR
  try{ const bmp=await createImageBitmap(blob); const k=Math.min(3,Math.max(1,1800/bmp.width));
    const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k);
    const g=cv.getContext("2d"); g.imageSmoothingQuality="high"; g.drawImage(bmp,0,0,cv.width,cv.height);
    const d=g.getImageData(0,0,cv.width,cv.height), a=d.data;
    for(let i=0;i<a.length;i+=4){ let y=0.299*a[i]+0.587*a[i+1]+0.114*a[i+2]; y=y>170?255:(y<90?0:(y-90)*255/80); a[i]=a[i+1]=a[i+2]=y; }
    g.putImageData(d,0,0); return await new Promise(ok=>cv.toBlob(ok,"image/png"));
  }catch(e){ return blob; } }
async function ocrImages(imgs, onProg){
  if(!window.Tesseract) await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
  const w=await window.Tesseract.createWorker("eng",1,{logger:m=>{ if(m.status==="recognizing text") onProg&&onProg(Math.round(m.progress*100)); }});
  let text=""; for(const im of imgs){ const r=await w.recognize(await prepOCR(im)); text+=r.data.text+"\n"; }
  await w.terminate(); return text;
}
async function claudeRead(imgs){
  const sample=await window.claude.use("sample").catch(()=>null); if(!sample) return null;
  const lim=await sample.limits().catch(()=>null); if(!lim||!lim.images) return null;
  const keys=SCAN_FIELDS.map(([k,l,u])=>`"${k}": ${l}${u?" ("+u+")":""}`).join(", ");
  const j=await sample.json(`These images are a body-composition scan report (Evolt 360, InBody or similar). Read the CURRENT scan values (not ranges, not previous results, not targets). Reply with only one JSON object using these keys, numbers only, omit any value you cannot see: {${keys}, "date": "YYYY-MM-DD scan date if shown"}`,
    {images:imgs.slice(0,lim.images.maxCount||1), modelTier:"default"});
  return j&&typeof j==="object"? j : null;
}
async function readScanFiles(files){
  S.scanBusy="กำลังอ่านไฟล์…"; S.scanMsg=null; render();
  try{
    let text="", imgs=[];
    for(const f of files){
      if(f.type==="application/pdf"||/\.pdf$/i.test(f.name)){ S.scanBusy="กำลังเปิด PDF…"; render(); const r=await pdfToInputs(f); text+=r.text; imgs.push(...r.imgs); }
      else imgs.push(f);
    }
    let vals = text.trim().length>80 ? parseScanText(text) : {};
    const cnt=o=>Object.keys(o).filter(k=>k!=="_date").length;
    let how = cnt(vals)>=4 ? "อ่านข้อความจาก PDF" : "";
    let date=null;
    if(cnt(vals)<4 && imgs.length && window.claude){
      S.scanBusy="Claude กำลังอ่านค่าจากรูป… (10–40 วินาที)"; render();
      try{ const j=await claudeRead(imgs); if(j){ date=/^\d{4}-\d{2}-\d{2}$/.test(j.date||"")?j.date:null; vals={...vals,...fixScan(j)}; how="Claude อ่านจากรูป"; } }
      catch(e){ if(e&&e.code==="not_granted") S.scanMsg="ไม่ได้อนุญาตให้ Claude อ่านรูป · ใช้ OCR ในเครื่องแทน"; }
    }
    if(cnt(vals)<4 && imgs.length){
      S.scanBusy="กำลังอ่านตัวอักษร (OCR)… ครั้งแรกต้องโหลดข้อมูล ~5 MB"; render();
      const t=await ocrImages(imgs, pc=>{ S.scanBusy=`กำลังอ่านตัวอักษร (OCR)… ${pc}%`; const e=$("#scanBusy"); if(e) e.textContent=S.scanBusy; });
      vals={...parseScanText(t),...vals}; how="OCR ในเครื่อง";
    }
    if(vals._date){ date=date||vals._date; delete vals._date; }
    const n=Object.keys(vals).length;
    S.scanDraft={date:date||today(), ...vals}; S.scanApply=true;
    S.scanMsg = n ? `${how}: ได้ ${n} ค่า · ตรวจตัวเลขให้ตรงกับใบผลก่อนกดบันทึก${n<6?" · ช่องที่ว่างกรอกเองได้":""}` : "อ่านค่าไม่ได้ · ลองรูปที่ชัดขึ้น ครอบเฉพาะตารางตัวเลข หรือกรอกเอง";
  }catch(e){ S.scanDraft={date:today()}; S.scanMsg="อ่านไฟล์ไม่สำเร็จ (ต้องต่ออินเทอร์เน็ตครั้งแรก) · กรอกเองได้"; }
  S.scanBusy=null; render();
}
function scanList(){ return Object.keys(S.days).filter(d=>S.days[d].scan).sort().map(d=>({d,...S.days[d].scan})); }

  return `<section class="card"><div class="row" style="justify-content:space-between;gap:8px"><div><h2 style="margin:0">ผลสแกน Evolt / InBody</h2><span class="tiny">ถ่ายรูปใบผล ภาพหน้าจอ หรือไฟล์ PDF · ระบบอ่านตัวเลขให้</span></div></div>

    ${form}
    ${L.length?`<div class="tw" style="margin-top:10px"><table class="scant"><thead><tr><th>วันที่</th><th>น้ำหนัก</th><th>กล้าม</th><th>ไขมัน</th><th>%ไขมัน</th><th>ช่องท้อง</th><th>เอว</th><th></th></tr></thead><tbody>

function scanSave(){
  const D={}; const date=$("#sc_date").value||today();
  SCAN_FIELDS.forEach(([k])=>{ const v=$("#sc_"+k).value; if(v!=="") D[k]=+v; });
  const clean=fixScan(D); if(!Object.keys(clean).length){ S.scanMsg="ยังไม่มีตัวเลข"; render(); return; }
  day(date).scan=clean; saveDay(date);
  if($("#sc_apply").checked){ const L=scanList(); const latest=L[L.length-1];
    if(latest.d===date){ if(clean.bf) S.profile.bf=clean.bf; if(clean.weight) S.profile.weight=clean.weight; if(clean.waist) S.profile.waist=clean.waist; saveProfile(); } }
  S.scanDraft=null; S.scanMsg="บันทึกผลสแกน "+thDate(date)+" แล้ว"; render();
}

function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); }
async function rasterPDF(root, onProg){
  if(!window.html2canvas) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  if(!window.jspdf) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  try{ await document.fonts.ready; }catch(e){}
  const { jsPDF } = window.jspdf;
  const pdf=new jsPDF({unit:"pt",format:"a4",compress:true});
  const PW=595.28, PH=841.89, M=34, CW=PW-2*M, FOOT=18, CH=PH-2*M-FOOT;
  let y=M, page=1;
  const secs=[...root.querySelectorAll(".rsec")];
  for(let i=0;i<secs.length;i++){
    onProg && onProg(i+1, secs.length);
    const cv=await window.html2canvas(secs[i],{scale:2,backgroundColor:"#ffffff",logging:false,useCORS:true});
    const ratio=CW/cv.width; let h=cv.height*ratio;
    if(h<=CH){ if(y+h>M+CH){ pdf.addPage(); page++; y=M; } pdf.addImage(cv.toDataURL("image/jpeg",.9),"JPEG",M,y,CW,h); y+=h; continue; }
    // tall section: slice across pages
    let sy=0; const pxPerPt=1/ratio;
    while(sy<cv.height){
      if(M+CH-y<80){ pdf.addPage(); page++; y=M; }
      const avail=(M+CH-y)*pxPerPt; const sh=Math.min(avail, cv.height-sy);
      const part=document.createElement("canvas"); part.width=cv.width; part.height=Math.ceil(sh);
      part.getContext("2d").drawImage(cv,0,sy,cv.width,sh,0,0,cv.width,sh);
      pdf.addImage(part.toDataURL("image/jpeg",.9),"JPEG",M,y,CW,sh*ratio); y+=sh*ratio; sy+=sh;
      if(sy<cv.height){ pdf.addPage(); page++; y=M; }
    }
  }
  const n=pdf.getNumberOfPages();
  for(let i=1;i<=n;i++){ pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(120); pdf.text(`Blueprint Coach  |  ${today()}  |  ${i} / ${n}`, PW/2, PH-16, {align:"center"}); }
  return pdf.output("blob");
}

    R.innerHTML=`<div class="rbar"><button class="btn pri" data-act="printNow">บันทึกเป็น PDF / พิมพ์</button><button class="btn" data-act="closeReport">ปิด</button></div>`+reportHTML();

  }

    else { const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),1000); S.importMsg="สร้าง PDF แล้ว"; }

document.addEventListener("click", ev=>{

  if(ds.goto){ S.tab=ds.goto; render(); window.scrollTo(0,0); return; }
  if(ds.chk){ const d=day(today()); d.chk={...(d.chk||{}), [ds.chk]:!(d.chk||{})[ds.chk]}; saveDay(today()); render(); return; }
  if(ds.dt){ S.dayType=ds.dt; render(); return; }
  if(ds.swap){ S.picks[ds.swap]=(S.picks[ds.swap]||0)+1; saveProfile(); render(); return; }
  if(ds.day){ S.trainSel=+ds.day; render(); return; }
  if(ds.howto){ howto(ds.howto); return; }
  if(ds.log){ S.logOpen[ds.log]=!S.logOpen[ds.log]; render(); return; }
  if(ds.savelog){ const k=ds.savelog, t=today(), last=lastLog(k,t); const sets=[];
    document.querySelectorAll(`[data-kg^="${k}:"]`).forEach(inp=>{ const s=+inp.dataset.kg.split(":")[1]; const rp=document.querySelector(`[data-rp="${k}:${s}"]`);
      const kg = inp.value!==""? +inp.value : (last?.sets?.[s]?.kg ?? null); const r = rp.value!==""? +rp.value : (last?.sets?.[s]?.r ?? null);
      if(kg!=null||r!=null) sets[s]={kg:kg??0, r:r??0}; });
    const d=day(t); d.lifts={...(d.lifts||{}), [k]:sets.filter(Boolean)}; S.logOpen[k]=false; saveDay(t); render(); return; }
  if(ds.act==="saveW"){ const v=parseFloat($("#qW").value); if(v>20&&v<400){ day(today()).w=v; saveDay(today()); render(); } return; }
  if(ds.act==="saveTrack"){ const d=$("#tD").value||today(); const w=parseFloat($("#tW").value), wa=parseFloat($("#tWa").value); const x=day(d);
    if(w>20&&w<400) x.w=w; else delete x.w; if(wa>30&&wa<250) x.waist=wa; else delete x.waist; S.trackDate=d; saveDay(d); render(); return; }
  if(ds.act==="wizDone"){ wizDone(); return; }
  if(ds.act==="scanPick"){ $("#scanFile").click(); return; }
  if(ds.act==="scanManual"){ S.scanDraft={date:today()}; S.scanApply=true; S.scanMsg=null; render(); return; }
  if(ds.act==="scanCancel"){ S.scanDraft=null; S.scanMsg=null; render(); return; }
  if(ds.act==="scanSave"){ scanSave(); return; }
  if(ds.scandel){ const x=S.days[ds.scandel]; if(x){ delete x.scan; saveDay(ds.scandel); } render(); return; }
  if(ds.act==="export"){ exportJSON(); return; }
  if(ds.act==="pdf"){ exportPDF(); return; }
  if(ds.act==="printNow"){ document.body.classList.add("printing"); setTimeout(()=>{ window.print(); },50); return; }
  if(ds.act==="closeReport"){ const R=$("#report"); R.innerHTML=""; R.className=""; R.setAttribute("aria-hidden","true"); return; }
  if(ds.act==="import"){ $("#impFile").click(); return; }
  if(ds.act==="reset"){ S.confirmReset=true; render(); return; }
  if(ds.act==="resetNo"){ S.confirmReset=false; render(); return; }
  if(ds.act==="resetYes"){ const ks=Object.keys(S.days); S.days={}; S.confirmReset=false; saveLocal();
    if(online) ks.forEach(k=>DB.doc("data/users/"+UID+"/profile").collection("days").doc(k).delete().catch(()=>{})); render(); return; }
});
document.addEventListener("change", ev=>{
  const el=ev.target;
  if(el.id==="tD"){ S.trackDate=el.value; render(); return; }
  if(el.id==="scanFile" && el.files && el.files.length){ readScanFiles([...el.files]); return; }
  if(el.id==="sc_apply"){ S.scanApply=el.checked; return; }
  if(el.id && el.id.startsWith("sc_") && S.scanDraft){ S.scanDraft[el.id==="sc_date"?"date":el.id.slice(3)] = el.value; return; }
  if(el.id==="impFile" && el.files && el.files[0]){ const fr=new FileReader();
    fr.onload=()=>{ try{ const j=JSON.parse(fr.result);
        if(!j || typeof j!=="object" || (!j.profile && !j.days)) throw 0;
        if(j.profile) S.profile={...DEFAULT_PROFILE,...j.profile};
        if(j.picks) S.picks={...j.picks};
        if(j.days && typeof j.days==="object") S.days={...S.days,...j.days};
        saveLocal();
        if(online){ DB.doc("data/users/"+UID+"/profile").set({profile:S.profile,picks:S.picks}).catch(syncErr);
          Object.keys(j.days||{}).forEach(k=>DB.doc("data/users/"+UID+"/profile").collection("days").doc(k).set(S.days[k]).catch(syncErr)); }
        if(j.profile){ S.hasProfile=true; S.setup=null; }
        S.importMsg="นำเข้าแล้ว ("+Object.keys(j.days||{}).length+" วัน)";
      }catch(e){ S.importMsg="ไฟล์ไม่ถูกต้อง"; } render(); };
    fr.readAsText(el.files[0]); return; }
  if(el.id && el.id.startsWith("w_") && S.wiz){ S.wiz[el.id.slice(2)]=el.value; if(el.id==="w_sex"){ S.wiz.focus = el.value==="f"?"glutes":"vshape"; render(); } return; }
  if(el.id && el.id.startsWith("p_")){
    const k=el.id.slice(2); let v=el.value;
    if(["age","height","weight","bf","waist","days","weeks","wheyP","wheyK","wheyServ","coffee","duration"].includes(k)) v = v===""? (k==="bf"?null:S.profile[k]) : +v;
    if(k==="lactose"||k==="creatineLoad") v = el.value==="1";
    S.profile[k]=v; saveProfile(); render();
  }
});
document.addEventListener("input", ev=>{ const el=ev.target; if(el.id && el.id.startsWith("w_") && S.wiz) S.wiz[el.id.slice(2)]=el.value; });
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape"){ $("#modalRoot").innerHTML=""; const R=$("#report"); if(R.className==="on"){ R.innerHTML=""; R.className=""; } } });
window.addEventListener("afterprint", ()=>document.body.classList.remove("printing"));

S.hasProfile = loadLocal();
if(!S.hasProfile && window.claude){ S.setup="wait"; render(); connect().finally(()=>{ S.setup = S.hasProfile? null : "on"; render(); }); }
else { S.setup = S.hasProfile? null : "on"; render(); connect(); }
})();
</script>
<script>if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>
</body>
</html>
