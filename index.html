body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;line-height:1.25;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--on-navy);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topin{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.3px}
.brand span{color:var(--gold)}
.pbtn{margin-left:auto;background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:999px;padding:4px 10px;font-size:12px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync{margin-left:8px;font-size:12px;opacity:.85;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.dot.on{background:#3ddc97}
main{max-width:920px;margin:0 auto;padding-block:14px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;color:var(--ink3);padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h2{font-size:17px;margin-bottom:8px}
.card h3{font-size:15px}
.eyebrow{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);font-weight:600}
.muted{color:var(--ink2)}.small{font-size:13px}.tiny{font-size:12px;color:var(--ink3)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.hero{background:var(--navy);color:var(--on-navy);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.hero .big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.hero .lab{font-size:12px;opacity:.75}
.hero .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hero .stats div{background:rgba(255,255,255,.07);border-radius:9px;padding:8px}
.hero .stats b{display:block;font-family:var(--f-num);font-size:17px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--chip);color:var(--ink2)}
.pill.acc{background:var(--accent);color:#fff}.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;color:var(--ink2);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bar{height:8px;border-radius:5px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macro{border-radius:10px;padding:9px;background:var(--surface2);border:1px solid var(--line)}
.macro b{font-family:var(--f-num);font-size:18px;display:block}
.macro span{font-size:12px;color:var(--ink3)}
.macro.p{border-top:3px solid var(--bad)}.macro.c{border-top:3px solid var(--gold)}.macro.f{border-top:3px solid var(--ok)}.macro.k{border-top:3px solid var(--navy)}
.check{display:flex;flex-direction:column;gap:6px}
.check button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 11px;color:var(--ink)}
.check button .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--ink3);flex:none;display:grid;place-items:center}
.check button[aria-pressed="true"] .bx{background:var(--ok);border-color:var(--ok)}
.check button[aria-pressed="true"] .bx::after{content:"";width:10px;height:6px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.check button[aria-pressed="true"] .t{color:var(--ink3);text-decoration:line-through}
.meal{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface2);display:grid;gap:6px}
.meal .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.meal .hd h3{font-size:15px}
.meal ul{margin:0;padding-left:18px}
.meal .tot{font-size:12px;color:var(--ink3)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:7px 12px;font-weight:500;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:none}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.days button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;min-width:70px;text-align:left;color:var(--ink)}
.days button small{display:block;font-size:11px;color:var(--ink3)}
.days button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.days button.today small::after{content:" · วันนี้";color:var(--accent)}
.ex{display:grid;grid-template-columns:92px 1fr;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface2)}
.ex .fig{background:var(--surface);border-radius:8px;border:1px solid var(--line)}
.ex .fig svg{width:100%;height:auto;display:block}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:90;background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:92vw;text-align:center;box-shadow:0 6px 24px #0005;transition:.25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
.pbar{height:8px;border-radius:5px;background:var(--chip);overflow:hidden;margin-top:3px}.pbar i{display:block;height:100%;border-radius:5px;transition:width .25s}
.ftot{display:grid;gap:8px;margin-top:8px}
.flog{display:grid;gap:4px}.frow{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:5px 0}
.frow .btn{padding:3px 9px}
.fpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:260px;overflow:auto}
.fitem{display:grid;text-align:left;gap:1px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:9px;padding:6px 8px;font-size:13px}
.chips .chip{border:0;cursor:pointer}.chip.p{background:var(--accent);color:#fff}
.phcmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.phcmp figure{margin:0;display:grid;gap:4px}
.phcmp img,.phempty{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.phempty{display:grid;place-items:center;color:var(--ink3);font-size:12px}
.lnav{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.lnav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-weight:600}
.lnav button.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}.lnav button.on{outline:2px solid var(--accent)}
.lsets{display:grid;gap:6px;margin-top:10px}.lset{display:grid;grid-template-columns:52px 1fr 1fr 74px;gap:6px;align-items:center}
.lset input{min-width:0}.lset.done input{border-color:var(--ok)}
.restbox{border-color:var(--accent)}.restbox.go{background:var(--ok-soft);border-color:var(--ok)}
.restT{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1.1}
.warm{margin-top:4px;background:var(--surface2);border-radius:8px;padding:5px 8px}
.wsum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.wsum div{background:var(--surface2);border-radius:9px;padding:7px}
.wsum b{display:block;font-family:var(--f-display);font-size:17px}.wsum span{font-size:11px;color:var(--ink3)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:8px}
.badge{display:grid;justify-items:center;text-align:center;gap:2px;padding:8px 4px;border-radius:10px;background:var(--surface2);opacity:.35;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;border:1px solid var(--gold)}.badge span{font-size:24px}.badge small{font-size:10.5px;line-height:1.2;color:var(--ink2)}
.sheet.chat{display:grid;grid-template-rows:auto 1fr auto;height:80vh}
.msgs{overflow:auto;display:grid;align-content:start;gap:8px;padding:4px 0}
.msg{padding:8px 11px;border-radius:12px;font-size:14px;line-height:1.55;max-width:92%}
.msg.user{background:var(--accent);color:#fff;justify-self:end}.msg.assistant{background:var(--surface2);border:1px solid var(--line)}
.swlist{display:grid;gap:6px}
.swrow{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--surface2)}
.swrow.on{border-color:var(--accent)}
.swrow .fig{padding:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:64px}
.swrow .fig svg{width:100%;height:auto;display:block}
.fig svg [stroke="#14213d"]{stroke:var(--ink)}
.fig svg [fill="#14213d"]{fill:var(--ink)}
.fig svg [stroke="#9aa3b2"]{stroke:var(--ink3)}
.fig svg [fill="#9aa3b2"]{fill:var(--ink3)}
.ex h3{font-size:15px}
.sr{font-family:var(--f-num);color:var(--accent);font-weight:600}
.hint{font-size:12.5px;border-radius:8px;padding:5px 8px;background:var(--ok-soft);color:var(--ok)}
.hint.same{background:var(--chip);color:var(--ink2)}
.sets{display:grid;gap:6px;margin-top:6px}
.setrow{display:grid;grid-template-columns:42px 1fr 1fr;gap:6px;align-items:center}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
label.f{display:grid;gap:4px;font-size:13px;color:var(--ink2);font-weight:500}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--ink3);font-weight:600;font-size:12px}
.tw{overflow-x:auto}
.advice{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:0 10px 10px 0;padding:10px 12px}
.advice.ok{border-color:var(--ok);background:var(--ok-soft)}
.chart svg{width:100%;height:auto;display:block}
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,16,32,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
.sheet .fig{max-width:260px;background:var(--surface2);border-radius:10px;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--chip);color:var(--ink2)}
.chip.p{background:var(--accent);color:#fff}
.feel{border-left:3px solid var(--ok);background:var(--ok-soft);padding:6px 10px;border-radius:0 8px 8px 0}
.mt td:nth-child(2){color:var(--bad);font-weight:700;width:18px;padding-inline:0}
.mt td:first-child{width:46%}
.note{font-size:12.5px;color:var(--ink3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px}
.kv dt{color:var(--ink3)}.kv dd{margin:0;font-family:var(--f-num)}
.scant th,.scant td{white-space:nowrap;padding-inline:5px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);border-radius:10px;padding:8px 10px}
@media (max-width:420px){.hero .stats{grid-template-columns:repeat(2,1fr)}.macros{grid-template-columns:repeat(2,1fr)}.ex{grid-template-columns:70px 1fr}}
@media (prefers-reduced-motion:no-preference){.card,.meal,.ex{transition:border-color .15s}}

/* ---------- PDF report ---------- */
#report{display:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
#report.on{display:block;position:fixed;inset:0;z-index:60;overflow:auto;-webkit-overflow-scrolling:touch;background:#5b6477;padding:0 0 calc(60px + env(safe-area-inset-bottom,0px))}
.roff{position:absolute;left:-12000px;top:0;width:760px}
#report.off{display:block;position:absolute;left:-12000px;top:0;width:760px}
.rbar{position:sticky;top:0;z-index:2;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 12px;background:#3d4559f2;margin-bottom:14px}
.rbar .rmsg{flex-basis:100%;text-align:center;color:#fff;font-size:13px}
.rdoc,.rdoc *{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.rdoc{--ink:#14213d;--ink2:#4a5672;--ink3:#6b7489;--line:#d9dfe9;--soft:#f3f6fa;--acc:#e85d04;--ok:#2a9d8f;--bad:#c1121f;
  width:760px;margin:0 auto;background:#fff;color:var(--ink);font-family:var(--f-body);font-size:12.5px;line-height:1.5;padding:36px 40px;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rdoc *{box-sizing:border-box}
.rsec{padding:0 0 18px}
.rdoc h1{font-family:var(--f-display);font-size:26px;margin:0;line-height:1.2}
.rdoc h2{font-family:var(--f-display);font-size:16px;margin:0 0 8px;padding-bottom:5px;border-bottom:2px solid var(--acc);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rdoc h2 small{font-family:var(--f-body);font-size:11px;color:var(--ink3);font-weight:400}
.rdoc h3{font-family:var(--f-display);font-size:13.5px;margin:10px 0 4px}
.rdoc table{width:100%;border-collapse:collapse;font-size:11.5px}
.rdoc th{background:var(--soft);color:var(--ink2);font-weight:600;font-size:11px;text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
.rdoc td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.rdoc td.n,.rdoc th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rdoc tr.tot td{font-weight:700;background:var(--soft)}
.rhead{background:#14213d;color:#fff;border-radius:12px;padding:20px 22px;display:grid;gap:6px}
.rhead .brand{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;font-size:12px;color:#fca311}
.rhead .meta{font-size:12px;opacity:.85}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--soft)}
.kpi b{display:block;font-family:var(--f-display);font-size:19px;line-height:1.2}
.kpi span{font-size:10.5px;color:var(--ink3)}
.kpi.good b{color:var(--ok)}.kpi.badv b{color:var(--bad)}
.rnote{font-size:10.5px;color:var(--ink3);margin:5px 0 0}
.radv{border-left:4px solid var(--acc);background:#fff4ec;padding:8px 12px;border-radius:0 8px 8px 0;margin-top:8px}
.rgrid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rdoc .rfig{width:54px}
.rdoc .rfig svg{width:54px;height:auto;display:block;background:#f6f8fb;border:1px solid var(--line);border-radius:6px}
.rdoc ul{margin:0;padding-left:18px}
.rfoot{font-size:10px;color:var(--ink3);text-align:center;padding-top:6px}
.rprog{color:#fff;font-size:13px;text-align:center}
@media print{
  @page{size:A4;margin:12mm}
  body.printing > *:not(#report){display:none !important}
  body.printing{background:#fff !important}
  body.printing::before{display:none}
  body.printing #report{display:block !important;position:static !important;background:#fff !important;padding:0 !important;overflow:visible !important}
  body.printing .rbar{display:none !important}
  body.printing .rdoc{width:auto;padding:0;margin:0;zoom:1 !important}
  .rsec{break-inside:avoid}
  .rsec.long{break-inside:auto}
  .rdoc tr{break-inside:avoid}
}
</style>

<body>
<header class="top"><div class="topin">
  <div class="brand">BLUEPRINT <span>COACH</span></div>
  <button class="pbtn" data-act="profiles" id="pbtn" aria-label="สลับผู้ใช้">👤</button>
  <div class="sync" id="sync"><span class="dot" id="syncdot"></span><span id="synctxt">บันทึกในเครื่องนี้</span></div>
</div></header>
<main id="view" aria-live="polite"></main>
<nav class="tabs" aria-label="เมนูหลัก"><div class="in" id="tabs"></div></nav>
<div id="modalRoot"></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r0 = x => Math.round(x), r5 = x => Math.round(x/5)*5, r10 = x => Math.round(x/10)*10, r50=x=>Math.round(x/50)*50;
const fmt = x => Math.round(x).toLocaleString("en-US");
const ymd = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const today = () => ymd(new Date());
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a,b) => Math.round((parseD(b)-parseD(a))/86400000);
const TH_DAYS = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัส","ศุกร์","เสาร์"];
const TH_SHORT = ["อา.","จ.","อ.","พ.","พฤ.","ศ.","ส."];
const thDate = s => { const d=parseD(s); return d.getDate()+" "+["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."][d.getMonth()]; };

/* ---------- state + storage ---------- */
const DEFAULT_PROFILE = {
  name:"", sex:"m", age:30, height:170, weight:70, bf:null, waist:null,
  goal:"fat", pace:"normal", days:4, level:"begin", equip:"gym", session:"evening",
  mealMode:"office", lactose:false,
  wheyName:"เวย์โปรตีน", wheyP:25, wheyK:120, wheyServ:60,
  creatineLoad:false, weeks:12, start:new Date().toISOString().slice(0,10), coffee:1, focus:"balanced", limit:"none"
};
const S = { profile:{...DEFAULT_PROFILE}, days:{}, picks:{}, dayType:null, tab:"today", trainSel:null, logOpen:{}, confirmReset:false, trackDate:null };
let DB=null, UID=null, online=false;
const LKEY="blueprint-coach-v1";
function loadLocal(){ try{ const j = JSON.parse(localStorage.getItem(lkey())||"null"); if(j){ if(j.profile) S.profile={...DEFAULT_PROFILE,...j.profile}; if(j.days) S.days=j.days; if(j.picks) S.picks=j.picks; return !!j.profile; } }catch(e){} return false; }
function saveLocal(){ try{ localStorage.setItem(lkey(), JSON.stringify({profile:S.profile, days:S.days, picks:S.picks})); }catch(e){} }
const timers={};
function debounce(key, fn, ms=700){ clearTimeout(timers[key]); timers[key]=setTimeout(fn, ms); }
function saveProfile(){ saveLocal(); try{ profMetaName(); }catch(e){} if(online) debounce("profile", ()=> DB.doc(ppath()).set({profile:S.profile, picks:S.picks}).catch(syncErr)); }
function saveDay(d){ saveLocal(); if(online) debounce("day-"+d, ()=> DB.doc(ppath()).collection("days").doc(d).set(S.days[d]||{}).catch(syncErr)); }
function syncErr(){ online=false; setSync(); }
function setSync(){ $("#syncdot").classList.toggle("on", online); $("#synctxt").textContent = online ? "บันทึกในบัญชีของคุณ" : "บันทึกในเครื่องนี้"; }
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    DB=db; UID=id;
    try{ const ms=await DB.doc("data/users/"+UID+"/meta").get(); if(ms.exists){ const mm=(ms.data()||{}).profiles; if(Array.isArray(mm)&&mm.length) localStorage.setItem("bc-profiles",JSON.stringify(mm)); } }catch(e){}
    const pref = DB.doc(ppath());
    const ps = await pref.get();
    if(ps.exists){ const d=ps.data()||{}; if(d.profile){ S.profile={...DEFAULT_PROFILE,...d.profile}; S.hasProfile=true; } if(d.picks) S.picks={...d.picks}; }
    const qs = await pref.collection("days").limit(1000).get();
    qs.docs.forEach(doc=>{ S.days[doc.id] = JSON.parse(JSON.stringify(doc.data()||{})); });
    online=true; setSync();
    // first time online: push local data up
    if(!ps.exists && S.hasProfile){ await pref.set({profile:S.profile, picks:S.picks}); for(const d of Object.keys(S.days)) await pref.collection("days").doc(d).set(S.days[d]); }
    saveLocal(); render();
  }catch(e){ online=false; setSync(); }
}
const day = d => (S.days[d] ||= {});

/* ---------- calculations ---------- */
function calc(p){
  const w=+p.weight||70, h=+p.height||170, a=+p.age||30, bf=+p.bf||0, male=p.sex!=="f";
  const lbm = bf>3 && bf<60 ? w*(1-bf/100) : null;
  const mifflin = 10*w + 6.25*h - 5*a + (male?5:-161);
  const bmr = lbm ? 370 + 21.6*lbm : mifflin;
  const days=effDays(p);
  const act = {2:1.3,3:1.375,4:1.45,5:1.5,6:1.55}[days] || 1.45;
  const tdee = bmr*act;
  const paceAdj = G(p).adj[p.pace] ?? 0;
  const onBreak = p.breakUntil && today()<=p.breakUntil;
  let target = onBreak ? tdee : tdee*(1+paceAdj) + (+p.kcalAdj||0);
  const floor = Math.max(bmr, male?1500:1200);
  if(target<floor) target=floor;
  const rest = days>=7 ? target : target-150;
  const train = days>=7 ? target : (7*target - (7-days)*rest)/days;
  const bmi = w/((h/100)**2);
  const protW = (bmi>30 && !lbm) ? (h-100) : w;   // adjusted weight for high BMI without BF
  const protPerKg = G(p).prot;
  const protein = lbm ? Math.min(protPerKg*w, 2.8*lbm) : protPerKg*protW;
  const macros = k => { const P=protein; const F=Math.max(0.6*w, k*0.27/9); const C=Math.max(0,(k-P*4-F*9)/4); return {k, P, C, F}; };
  const water = w*0.035 + 0.5;
  const hrMax = 220-a;
  const weeklyKg = (target - tdee)*7/7700;
  const capWeekly = G(p).kind==="cut" ? Math.max(weeklyKg, -0.01*w) : weeklyKg;
  const weeks=+p.weeks||12;
  let endW = w + capWeekly*weeks;
  let tgtBFw=null;

function roundStep(x, st){ return Math.max(0, Math.round(x/st)*st); }
function buildMeal(tp, tgt, F){
  const items={}; const add=(k,a)=>{ if(a>0) items[k]=(items[k]||0)+a; };
  const tot=()=>{ let k=0,P=0,C=0,Fa=0; for(const [id,a] of Object.entries(items)){ const f=F[id]; const m=a/f.per; k+=f.k*m;P+=f.P*m;C+=f.C*m;Fa+=f.F*m;} return {k,P,C,F:Fa}; };
  if(tp.veg) add("veg",1);
  if(tp.fix) for(const [k,a] of Object.entries(tp.fix)) add(k,a);
  const Fc=tp.c?F[tp.c]:null, Ff=tp.f?F[tp.f]:null;
  const estFatC = Ff ? Math.max(0,tgt.F-tot().F)*(Ff.C/Ff.F) : 0;
  const estCarbP = Fc ? Math.max(0,tgt.C-tot().C-estFatC)*(Fc.P/Fc.C) : 0;
  const estFatP = Ff ? Math.max(0,tgt.F-tot().F)*(Ff.P/Ff.F) : 0;
  if(tp.p){ const f=F[tp.p]; const need = tgt.P - tot().P - estCarbP - estFatP; let a = roundStep(need/f.P*f.per, f.step); a=Math.max(a, f.min); add(tp.p,a); }
  if(tp.c){ const f=F[tp.c]; const fatAfterP = Ff ? Math.max(0,tgt.F-tot().F)*(Ff.C/Ff.F) : 0; const need = tgt.C - tot().C - fatAfterP; add(tp.c, roundStep(need/f.C*f.per, f.step)); }
  if(tp.f){ const f=F[tp.f]; const need = tgt.F - tot().F; add(tp.f, roundStep(need/f.F*f.per, f.step)); }
  return {items, t:tot()};
}
function mealPlan(p, type){
  const c=calc(p), M= type==="train"? c.trainM : c.restM, F=foods(p);
  return slots(p,type).map(([key,name,time,fp,fc,ff],i)=>{
    let list = TPL[key].filter(t=>!(p.lactose && (t.lact || t.p==="yogurt")));
    if(!list.length) list=TPL[key];
    const pk = (S.picks[type+i]||0) % list.length;
    const tp = list[pk];
    const m = buildMeal(tp, {P:M.P*fp, C:M.C*fc, F:M.F*ff}, F);
    return {key,name,time,tp,idx:i,nopts:list.length,...m};
  });
}

function creatineToday(p){
  const loadDays=7, n=diffDays(p.start, today());
  if(p.creatineLoad && n>=0 && n<loadDays) return {short:`Creatine 5 g × 4 (Load วันที่ ${n+1}/7)`, load:true, left:loadDays-n};
  return {short:"Creatine 5 g", load:false};
}
function streak(){ let n=0, d=today(); const all=k=>{const c=(S.days[k]||{}).chk||{}; return ["protein","water","steps","creatine","workout","sleep"].every(x=>c[x]);};
  if(!all(d)) d=addDays(d,-1); while(all(d)){ n++; d=addDays(d,-1);} return n; }

/* ---------- trend + advice ---------- */
function trend(){
  const ds=Object.keys(S.days).filter(d=>S.days[d].w).sort();
  const vals=ds.map(d=>({d,w:+S.days[d].w}));
  const t=today();
  const win=(a,b)=>{ const v=vals.filter(x=>x.d>a && x.d<=b).map(x=>x.w); return v.length?v.reduce((s,x)=>s+x,0)/v.length:null; };
  const avg7=win(addDays(t,-7),t), prev7=win(addDays(t,-14),addDays(t,-7));
  return {vals, avg7, prev7, rate:(avg7!=null&&prev7!=null)?avg7-prev7:null, n:vals.length, span: vals.length?diffDays(vals[0].d, vals[vals.length-1].d):0};
}
function advice(){
  const p=S.profile, tr=trend(), w=+p.weight;
  if(tr.n<8 || tr.rate==null) return {cls:"", t:"ระบบจะเริ่มให้คำแนะนำปรับแผนเมื่อมีน้ำหนักครบ 2 สัปดาห์ (บันทึกอย่างน้อย 8 วัน)"};
  const pct=tr.rate/w*100;
  if(creatineToday(p).load || diffDays(p.start,today())<14) return {cls:"", t:"2 สัปดาห์แรกน้ำหนักแกว่งจากน้ำและ Creatine — ยังไม่ต้องปรับ"};
  const kind=G(p).kind;
  if(kind==="cut"){ if(pct>(p.goal==="tone"?-0.1:-0.25)) return {cls:"", d:-125, t:`ลดได้ ${tr.rate.toFixed(2)} kg/สัปดาห์ ช้ากว่าเป้า → ลด 100–150 kcal (จากคาร์บ/ไขมัน) หรือเพิ่มก้าวเดิน 2,000 ก้าว/วัน · ห้ามลดโปรตีน`};
    if(pct<-1.0) return {cls:"", d:125, t:`ลดเร็ว ${tr.rate.toFixed(2)} kg/สัปดาห์ → เพิ่ม 100–150 kcal จากคาร์บ เพื่อรักษากล้ามเนื้อ`};
    return {cls:"ok", t:`ลด ${tr.rate.toFixed(2)} kg/สัปดาห์ อยู่ในช่วงเป้า — ทำต่อแบบเดิม`}; }
  if(kind==="strength"){ if(pct<-0.2) return {cls:"",d:150,t:"น้ำหนักลดระหว่างเน้นความแข็งแรง → เพิ่ม 150 kcal/วัน"}; return {cls:"ok",t:"น้ำหนักทรงตัว/ขึ้นช้า เหมาะกับการเพิ่มความแข็งแรง — ดูน้ำหนักที่ยกได้ในหน้าฝึกเป็นหลัก"}; }
  if(kind==="gain"){ if(pct<0.1) return {cls:"", d:150, t:`น้ำหนักแทบไม่ขึ้น → เพิ่ม 150 kcal/วัน (จากคาร์บ)`}; if(pct>0.6) return {cls:"", d:-100, t:`น้ำหนักขึ้นเร็ว → ลด 100 kcal/วัน เพื่อลดไขมันสะสม`}; return {cls:"ok",t:`เพิ่ม ${tr.rate.toFixed(2)} kg/สัปดาห์ อยู่ในช่วงเป้า`}; }
  if(kind==="recomp"){ if(pct<-0.6) return {cls:"",d:100,t:"ลดเร็วเกินสำหรับ Recomp → เพิ่ม 100 kcal"}; return {cls:"ok",t:"น้ำหนักทรงตัว/ลดช้า เหมาะกับ Recomp — ดูรอบเอวประกอบ"}; }
  if(Math.abs(pct)>0.4) return {cls:"",d:pct>0?-100:100,t:`น้ำหนักเปลี่ยน ${tr.rate.toFixed(2)} kg/สัปดาห์ → ปรับ ±100 kcal ให้ทรงตัว`}; return {cls:"ok",t:"น้ำหนักทรงตัวตามเป้า"};
}

function chart(p,c,tr){
  const W=520,H=260,L=40,R=14,T=14,B=28;
  const start=p.start, end=addDays(start, (+p.weeks)*7);
  const pts=tr.vals.filter(v=>v.d>=addDays(start,-14));
  const all=[...pts.map(x=>x.w), +p.weight, c.endW];
  let lo=Math.floor(Math.min(...all)-1), hi=Math.ceil(Math.max(...all)+1);
  const x0=parseD(addDays(start,-3)), x1=parseD(end);
  const X=d=>L+(parseD(d)-x0)/(x1-x0)*(W-L-R), Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const ticks=[]; const st=Math.max(1,Math.ceil((hi-lo)/5)); for(let v=lo; v<=hi; v+=st) ticks.push(v);
  const avg=pts.map((x,i)=>{ const win=pts.filter(y=>y.d<=x.d && y.d>addDays(x.d,-7)); return {d:x.d, w:win.reduce((s,y)=>s+y.w,0)/win.length}; });
  const path=a=>a.map((x,i)=>(i?"L":"M")+X(x.d).toFixed(1)+","+Y(x.w).toFixed(1)).join("");
  const xt=[]; for(let i=0;i<=+p.weeks;i+=Math.max(1,Math.round(+p.weeks/6))) xt.push(i);
  const td=today();
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟน้ำหนัก">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="13" fill="var(--ink3)" font-family="IBM Plex Mono,monospace">${v}</text>`).join("")}
    ${xt.map(i=>`<text x="${X(addDays(start,i*7))}" y="${H-8}" text-anchor="middle" font-size="13" fill="var(--ink3)">W${i}</text>`).join("")}
    <line x1="${X(start)}" y1="${Y(+p.weight)}" x2="${X(end)}" y2="${Y(c.endW)}" stroke="var(--gold)" stroke-width="2" stroke-dasharray="6 5"/>
    ${td>=start&&td<=end?`<line x1="${X(td)}" x2="${X(td)}" y1="${T}" y2="${H-B}" stroke="var(--ink3)" stroke-width="1" stroke-dasharray="2 3"/>`:""}
    ${pts.map(x=>`<circle cx="${X(x.d)}" cy="${Y(x.w)}" r="3" fill="var(--ink3)" opacity=".7"/>`).join("")}
    ${avg.length>1?`<path d="${path(avg)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`:""}
    ${avg.length?`<circle cx="${X(avg[avg.length-1].d)}" cy="${Y(avg[avg.length-1].w)}" r="5" fill="var(--accent)"/>`:""}
    ${!pts.length?`<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="13" fill="var(--ink3)">บันทึกน้ำหนักวันแรกเพื่อเริ่มกราฟ</text>`:""}
  </svg>`;
}

/* ---------- body-composition scans (Evolt / InBody) ---------- */
const SCAN_FIELDS=[
 ["weight","น้ำหนัก","kg",30,250,[/body\s*weight/,/\bweight\b/,/น้ำหนัก/]],
 ["smm","มวลกล้ามเนื้อ (SMM)","kg",10,80,[/skeletal\s*muscle\s*mass/,/\bsmm\b/,/muscle\s*mass/,/มวลกล้ามเนื้อ/]],
 ["fatMass","มวลไขมัน","kg",1,120,[/body\s*fat\s*mass/,/\bfat\s*mass\b/,/มวลไขมัน/]],
 ["bf","% ไขมัน","%",3,60,[/(?:percent(?:age)?\s*(?:of\s*)?body\s*fat|body\s*fat\s*(?:percent(?:age)?|%))/,/\bpbf\b/,/body\s*fat(?!\s*mass)/,/เปอร์เซ็นต์ไขมัน|%\s*ไขมัน/]],
 ["lbm","มวลไร้ไขมัน","kg",20,150,[/lean\s*body\s*mass/,/fat\s*free\s*mass/,/lean\s*mass/,/\b(?:lbm|ffm)\b/,/มวลไร้ไขมัน/]],
 ["tbw","น้ำในร่างกาย","L",15,90,[/total\s*body\s*water/,/\btbw\b/,/body\s*water/,/น้ำในร่างกาย/]],
 ["visceral","ไขมันช่องท้อง (ระดับ)","",1,30,[/visceral\s*fat\s*level/,/visceral\s*(?:fat\s*)?(?:rating|level)/,/visceral\s*fat(?!\s*area)/,/ไขมันในช่องท้อง/]],
 ["vfa","พื้นที่ไขมันช่องท้อง","cm²",10,400,[/visceral\s*fat\s*area/,/\bvfa\b/]],
 ["torsoFat","ไขมันลำตัว","kg",1,60,[/(?:torso|trunk)\s*fat(?:\s*mass)?/,/ไขมันลำตัว/]],
 ["bmr","BMR","kcal",800,4000,[/basal\s*metabolic\s*rate/,/\bbmr\b/,/อัตราการเผาผลาญ/]],
 ["bwi","BWI","",0,10,[/body\s*wellness\s*index/,/\bbwi\b/]],
 ["waist","รอบเอว","cm",40,200,[/waist(?:\s*circumference)?/,/รอบเอว/]]
];
function parseScanText(raw){
  const t=String(raw||"").toLowerCase().replace(/(\d),(\d{3})\b/g,"$1$2").replace(/(\d),(\d)/g,"$1.$2").replace(/[ \t]+/g," ");
  const out={};
  for(const [k,,,lo,hi,res] of SCAN_FIELDS){
    for(const re of res){ const g=new RegExp(re.source,"g"); let m, hit=null;
      while((m=g.exec(t))){ const after=t.slice(m.index+m[0].length, m.index+m[0].length+70);
        const nums=[...after.matchAll(/-?\d+(?:\.\d+)?/g)].map(x=>+x[0]); const v=nums.find(n=>n>=lo&&n<=hi); if(v!=null){ hit=v; break; } }
      if(hit!=null){ out[k]=hit; break; } }
  }
  const r=fixScan(out);
  let dm=t.match(/(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})/), d=null;
  if(dm) d=[dm[1],dm[2],dm[3]]; else if((dm=t.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](20\d{2})\b/))) d=[dm[3],dm[2],dm[1]];
  if(d){ const iso=d[0]+"-"+String(d[1]).padStart(2,"0")+"-"+String(d[2]).padStart(2,"0"); if(+d[1]>=1&&+d[1]<=12&&+d[2]>=1&&+d[2]<=31&&iso<=today()) r._date=iso; }
  return r;
}
function fixScan(o){
  const r={}; for(const [k,,,lo,hi] of SCAN_FIELDS){ const v=parseFloat(o[k]); if(isFinite(v)&&v>=lo&&v<=hi) r[k]=Math.round(v*100)/100; }
  if(r.weight&&r.fatMass&&!r.bf) r.bf=Math.round(r.fatMass/r.weight*1000)/10;
  if(r.weight&&r.bf&&!r.fatMass) r.fatMass=Math.round(r.weight*r.bf/10)/100;
  if(r.weight&&r.fatMass&&!r.lbm) r.lbm=Math.round((r.weight-r.fatMass)*100)/100;
  return r;
}
async function pdfToInputs(file){
  if(!window.pdfjsLib) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }catch(e){}
  const doc=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  let text=""; const imgs=[];
  for(let i=1;i<=Math.min(doc.numPages,3);i++){ const pg=await doc.getPage(i);
    const tc=await pg.getTextContent(); text+=tc.items.map(x=>x.str).join(" ")+"\n";
    const vp=pg.getViewport({scale:2}); const cv=document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height;
    await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
    imgs.push(await new Promise(ok=>cv.toBlob(ok,"image/png"))); }
  return {text, imgs};
}
async function prepOCR(blob){ // upscale small images + grayscale/contrast for better OCR
  try{ const bmp=await createImageBitmap(blob); const k=Math.min(3,Math.max(1,1800/bmp.width));
    const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k);
    const g=cv.getContext("2d"); g.imageSmoothingQuality="high"; g.drawImage(bmp,0,0,cv.width,cv.height);
    const d=g.getImageData(0,0,cv.width,cv.height), a=d.data;
    for(let i=0;i<a.length;i+=4){ let y=0.299*a[i]+0.587*a[i+1]+0.114*a[i+2]; y=y>170?255:(y<90?0:(y-90)*255/80); a[i]=a[i+1]=a[i+2]=y; }
    g.putImageData(d,0,0); return await new Promise(ok=>cv.toBlob(ok,"image/png"));
  }catch(e){ return blob; } }
async function ocrImages(imgs, onProg){
  if(!window.Tesseract) await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
  const w=await window.Tesseract.createWorker("eng",1,{logger:m=>{ if(m.status==="recognizing text") onProg&&onProg(Math.round(m.progress*100)); }});
  let text=""; for(const im of imgs){ const r=await w.recognize(await prepOCR(im)); text+=r.data.text+"\n"; }
  await w.terminate(); return text;
}
async function claudeRead(imgs){
  const sample=await window.claude.use("sample").catch(()=>null); if(!sample) return null;
  const lim=await sample.limits().catch(()=>null); if(!lim||!lim.images) return null;
  const keys=SCAN_FIELDS.map(([k,l,u])=>`"${k}": ${l}${u?" ("+u+")":""}`).join(", ");
  const j=await sample.json(`These images are a body-composition scan report (Evolt 360, InBody or similar). Read the CURRENT scan values (not ranges, not previous results, not targets). Reply with only one JSON object using these keys, numbers only, omit any value you cannot see: {${keys}, "date": "YYYY-MM-DD scan date if shown"}`,
    {images:imgs.slice(0,lim.images.maxCount||1), modelTier:"default"});
  return j&&typeof j==="object"? j : null;
}
async function readScanFiles(files){
  S.scanBusy="กำลังอ่านไฟล์…"; S.scanMsg=null; render();
  try{
    let text="", imgs=[];
    for(const f of files){
      if(f.type==="application/pdf"||/\.pdf$/i.test(f.name)){ S.scanBusy="กำลังเปิด PDF…"; render(); const r=await pdfToInputs(f); text+=r.text; imgs.push(...r.imgs); }
      else imgs.push(f);
    }
    let vals = text.trim().length>80 ? parseScanText(text) : {};
    const cnt=o=>Object.keys(o).filter(k=>k!=="_date").length;
    let how = cnt(vals)>=4 ? "อ่านข้อความจาก PDF" : "";
    let date=null;
    if(cnt(vals)<4 && imgs.length && window.claude){
      S.scanBusy="Claude กำลังอ่านค่าจากรูป… (10–40 วินาที)"; render();
      try{ const j=await claudeRead(imgs); if(j){ date=/^\d{4}-\d{2}-\d{2}$/.test(j.date||"")?j.date:null; vals={...vals,...fixScan(j)}; how="Claude อ่านจากรูป"; } }
      catch(e){ if(e&&e.code==="not_granted") S.scanMsg="ไม่ได้อนุญาตให้ Claude อ่านรูป · ใช้ OCR ในเครื่องแทน"; }
    }
    if(cnt(vals)<4 && imgs.length){
      S.scanBusy="กำลังอ่านตัวอักษร (OCR)… ครั้งแรกต้องโหลดข้อมูล ~5 MB"; render();
      const t=await ocrImages(imgs, pc=>{ S.scanBusy=`กำลังอ่านตัวอักษร (OCR)… ${pc}%`; const e=$("#scanBusy"); if(e) e.textContent=S.scanBusy; });
      vals={...parseScanText(t),...vals}; how="OCR ในเครื่อง";
    }
    if(vals._date){ date=date||vals._date; delete vals._date; }
    const n=Object.keys(vals).length;
    S.scanDraft={date:date||today(), ...vals}; S.scanApply=true;
    S.scanMsg = n ? `${how}: ได้ ${n} ค่า · ตรวจตัวเลขให้ตรงกับใบผลก่อนกดบันทึก${n<6?" · ช่องที่ว่างกรอกเองได้":""}` : "อ่านค่าไม่ได้ · ลองรูปที่ชัดขึ้น ครอบเฉพาะตารางตัวเลข หรือกรอกเอง";
  }catch(e){ S.scanDraft={date:today()}; S.scanMsg="อ่านไฟล์ไม่สำเร็จ (ต้องต่ออินเทอร์เน็ตครั้งแรก) · กรอกเองได้"; }
  S.scanBusy=null; render();
}

    ${form}

function scanSave(){

  day(date).scan=clean; saveDay(date);

}

function wheyFood(p){ return {n:p.wheyName||"เวย์โปรตีน",u:"1 Scoop",k:+p.wheyK||120,P:+p.wheyP||25,C:3,F:1.5,cat:"supp"}; }
function foodOf(e,p){ if(e.id==="whey") return wheyFood(p); if(e.id==="custom"||e.id==="ai") return {n:e.n,u:e.u||"",k:+e.k||0,P:+e.P||0,C:+e.C||0,F:+e.F||0}; return FOOD[e.id]; }
function foodTotals(d,p){ const t={k:0,P:0,C:0,F:0}; (d.food||[]).forEach(e=>{ const f=foodOf(e,p); if(!f) return; const q=+e.q||1; t.k+=f.k*q; t.P+=f.P*q; t.C+=f.C*q; t.F+=f.F*q; }); return t; }

function addFood(id,extra){ const d=day(today()); d.food=(d.food||[]).slice(); const ex=d.food.findIndex(e=>e.id===id&&id!=="custom"&&id!=="ai"); if(ex>=0&&!extra) d.food[ex]={...d.food[ex],q:(+d.food[ex].q||1)+1}; else d.food.push({id,q:1,...(extra||{})});
  if(foodTotals(d,S.profile).P>=calc(S.profile)[todayType(S.profile).type==="train"?"trainM":"restM"].P*0.95){ d.chk={...(d.chk||{}),protein:true}; }

const SUPP_DEF=[["whey","เวย์โปรตีน","ตามแผนอาหาร",true],["creatine","Creatine","ทุกวัน",true],["multi","Multivitamin","เช้า พร้อมอาหาร",true],["cad3","Calcium + D3 + K2","กลางวัน พร้อมอาหาร",true],["mg","Magnesium","ก่อนนอน",true],["fish","น้ำมันปลา","พร้อมอาหาร",false],["coq10","CoQ10","เช้า",false]];
function suppOn(p){ const on=p.suppOn||{}; return SUPP_DEF.filter(([id,,,def])=> on[id]===undefined? def : on[id]); }
function wheyPerDay(p){ const tr=mealPlan(p,"train").reduce((a,m)=>a+(m.items.whey||0),0), rs=mealPlan(p,"rest").reduce((a,m)=>a+(m.items.whey||0),0); const n=effDays(p); return (tr*n+rs*(7-n))/7; }
function wheyLeft(p){ if(p.wheyStock==null||!p.wheyStockDate) return null; const used=wheyPerDay(p)*Math.max(0,diffDays(p.wheyStockDate,today())); const left=Math.max(0,p.wheyStock-used); const per=wheyPerDay(p); return {left, days: per? left/per : null}; }
function suppCard(){
  const p=S.profile, d=day(today()), sp=d.supp||{}, chk=d.chk||{}, list=suppOn(p);
  const isDone=id=> id==="creatine"? !!chk.creatine : !!sp[id];
  const wl=wheyLeft(p);
  return `<section class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">อาหารเสริมวันนี้</h2><span class="pill ${list.every(([id])=>isDone(id))?"ok":""}">${list.filter(([id])=>isDone(id)).length}/${list.length}</span></div>
    <div class="check" style="margin-top:8px">${list.map(([id,n,tm])=>`<button data-supp="${id}" aria-pressed="${isDone(id)}"><span class="bx"></span><span class="t">${esc(n)} <span class="tiny">· ${esc(id==="creatine"?creatineToday(p).short.replace("Creatine ",""):tm)}</span></span></button>`).join("")}</div>
    ${wl?`<p class="tiny" style="margin-top:8px">${wl.days!=null&&wl.days<7?"⚠️ ":""}เวย์เหลือประมาณ <b>${Math.round(wl.left)} Scoop</b> (~${wl.days!=null?Math.round(wl.days):"—"} วัน)${wl.days!=null&&wl.days<7?" · ถึงเวลาสั่งกระปุกใหม่":""} · <button class="btn ghost" data-act="wheyNew" style="padding:2px 6px">เปิดกระปุกใหม่</button></p>`
      :`<p class="tiny" style="margin-top:8px">อยากให้เตือนก่อนเวย์หมด? <button class="btn ghost" data-act="wheyNew" style="padding:2px 6px">เริ่มนับกระปุกนี้</button> · เปิด/ปิดรายการได้ในโปรไฟล์</p>`}
  </section>`;

/* ---- PR detection ---- */
function bestBefore(k,date){ let b=0; Object.keys(S.days).forEach(d=>{ if(d>=date) return; ((S.days[d].lifts||{})[k]||[]).forEach(s=>{ if(s){ const v=e1rm(s); if(v>b) b=v; } }); }); return b; }
function checkPR(k,set,date){ const prev=bestBefore(k,date); const v=e1rm(set); if(prev>0 && v>prev+0.01){ const d=day(date); d.prs=[...new Set([...(d.prs||[]),k])]; saveDay(date); toast(`🏆 PR ใหม่! ${DATA.ex[k].n} · ${set.kg} kg × ${set.r} (1RM ~${v.toFixed(1)} kg)`,4500); } }

/* ================= EXTRAS B: warm-up, plates, exercise progress, cardio ================= */
const BARBELL=new Set(["barbell_bench_press","close_grip_bench","barbell_row","deadlift","barbell_ohp","barbell_curl","barbell_back_squat","barbell_rdl","hip_thrust","tbar_row"]);
const SMITH=new Set(["smith_incline_press","smith_squat"]);
function plates(total,bar=20){ let side=(total-bar)/2; if(side<=0) return []; const out=[]; for(const pl of [25,20,15,10,5,2.5,1.25]){ while(side>=pl-1e-9){ out.push(pl); side-=pl; } } return out; }
function warmupHTML(p,k,last){
  const e=DATA.ex[k]; if(e.t!=="c") return "";
  const work = last&&last.sets.length? Math.max(...last.sets.map(s=>+s.kg||0)) : 0;
  const isBB=BARBELL.has(k)||SMITH.has(k), step=isBB?2.5:(/^db_|dumbbell|goblet|arnold|bulgarian|step_up|split|lunge|single_leg/.test(k)?1:5);
  const rnd=x=>Math.max(isBB?20:0,Math.round(x/step)*step);
  if(!work) return `<div class="tiny warm">วอร์มอัพ: น้ำหนักเบา 1–2 เซ็ต × 10–12 ครั้ง ก่อนเซ็ตจริง</div>`;

function icsText(p,weeks,time){
  const [hh,mm]=(time||"18:30").split(":").map(Number), dur=+p.duration||60, t0=today();
  const pad=n=>String(n).padStart(2,"0"), dt=(d,h,m)=>d.replace(/-/g,"")+"T"+pad(h)+pad(m)+"00";
  const end=(h,m,add)=>{ const x=h*60+m+add; return [Math.floor(x/60)%24,x%60]; };
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Blueprint Coach//TH","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Blueprint Coach"];
  const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  for(let i=0;i<weeks*7;i++){ const d=addDays(t0,i), k=planDay(p,d); if(k==="R") continue;
    const isC=k==="C"||k==="CM", min=isC?Math.max(30,parseInt(cardioRx(p,k).match(/(\d+)(?:–\d+)? นาที/)?.[1]||"45")):dur+15;
    const [eh,em]=end(hh,mm,min); const list=dayList(p,k);
    const desc=(isC?cardioRx(p,k):list.map((x,j)=>{const rx=rxFor(p,x,j); return `${j+1}. ${DATA.ex[x].n} ${rx.s}x${rx.r}`;}).join("\\n")+"\\nปิดท้าย: "+cardioRx(p,"post")).replace(/,/g,"\\,").replace(/;/g,"\\;");
    L.push("BEGIN:VEVENT","UID:bc-"+d+"-"+k+"@blueprint","DTSTAMP:"+stamp,"DTSTART:"+dt(d,hh,mm),"DTEND:"+dt(d,eh,em),
      "SUMMARY:"+(isC?"🏃 ":"🏋️ ")+DN(k,p).replace(/,/g,"\\,"),"DESCRIPTION:"+desc,
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:ใกล้เวลาซ้อม","TRIGGER:-PT30M","END:VALARM","END:VEVENT"); }
  L.push("END:VCALENDAR");
  const fold=line=>{ const out=[]; let cur="", bytes=0; for(const ch of line){ const b=new TextEncoder().encode(ch).length; if(bytes+b>72){ out.push(cur); cur=" "; bytes=1; } cur+=ch; bytes+=b; } out.push(cur); return out.join("\r\n"); };
  return L.map(fold).join("\r\n");
}

/* A1. calorie adjust from advice */
function adviceDelta(a){ return a&&a.d? a.d : 0; }
function applyAdvice(){ const a=advice(), d=adviceDelta(a); if(!d) return; S.profile.kcalAdj=(+S.profile.kcalAdj||0)+d; S.profile.kcalAdjDate=today(); saveProfile(); toast(`ปรับเป้าแคลอรี่ ${d>0?"+":""}${d} kcal/วันแล้ว · แผนอาหารคำนวณใหม่`); render(); }
/* A2. double progression target for each set */
function stepFor(k){ return BARBELL.has(k)||SMITH.has(k)?2.5:(/^db_|dumbbell|goblet|arnold|bulgarian|step_up|split|lunge|single_leg|hammer|concentration|incline_db|kickback|farmers/.test(k)?1:2.5); }
function nextTarget(p,k,idx){
  const rx=rxFor(p,k,idx), last=lastLog(k,today()); if(!last||!last.sets.length||/วิ/.test(rx.r)) return null;
  const m=String(rx.r).match(/(\d+)\s*[–-]\s*(\d+)/), lo=m?+m[1]:topRep(rx.r), hi=m?+m[2]:topRep(rx.r);
  const kgMax=Math.max(...last.sets.map(s=>+s.kg||0)); const hitAll=last.sets.length>=rx.s && last.sets.every(s=>+s.r>=hi);
  if(hitAll && kgMax>0){ const st=stepFor(k); const nk=Math.max(kgMax+st, Math.round(kgMax*1.025/st)*st); return {kg:nk,r:lo,why:`ครั้งก่อนครบ ${hi} ครั้งทุกเซ็ต → เพิ่มน้ำหนักเป็น ${nk} kg เริ่มที่ ${lo} ครั้ง`}; }
  const r=Math.min(hi, Math.max(...last.sets.map(s=>+s.r||0))+1);
  return {kg:kgMax,r,why:`น้ำหนักเดิม ${kgMax} kg พยายามทำ ${r} ครั้ง (เพิ่ม 1 ครั้ง)`};
}
/* A3. US Navy body-fat from tape */
function navyBF(p,m){ const h=+p.height; if(!m||!m.neck||!m.waist||!h) return null;
  if(p.sex==="f"){ if(!m.hip) return null; const v=495/(1.29579-0.35004*Math.log10(m.waist+m.hip-m.neck)+0.22100*Math.log10(h))-450; return v>3&&v<60?v:null; }
  const v=495/(1.0324-0.19077*Math.log10(m.waist-m.neck)+0.15456*Math.log10(h))-450; return v>3&&v<60?v:null; }

function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); }
async function rasterPDF(root, onProg){
  if(!window.html2canvas) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  if(!window.jspdf) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  try{ await document.fonts.ready; }catch(e){}
  const { jsPDF } = window.jspdf;
  const pdf=new jsPDF({unit:"pt",format:"a4",compress:true});
  const PW=595.28, PH=841.89, M=34, CW=PW-2*M, FOOT=18, CH=PH-2*M-FOOT;
  let y=M, page=1;
  const secs=[...root.querySelectorAll(".rsec")];
  for(let i=0;i<secs.length;i++){
    onProg && onProg(i+1, secs.length);
    const cv=await window.html2canvas(secs[i],{scale:2,backgroundColor:"#ffffff",logging:false,useCORS:true});
    const ratio=CW/cv.width; let h=cv.height*ratio;
    if(h<=CH){ if(y+h>M+CH){ pdf.addPage(); page++; y=M; } pdf.addImage(cv.toDataURL("image/jpeg",.9),"JPEG",M,y,CW,h); y+=h; continue; }
    // tall section: slice across pages
    let sy=0; const pxPerPt=1/ratio;
    while(sy<cv.height){
      if(M+CH-y<80){ pdf.addPage(); page++; y=M; }
      const avail=(M+CH-y)*pxPerPt; const sh=Math.min(avail, cv.height-sy);
      const part=document.createElement("canvas"); part.width=cv.width; part.height=Math.ceil(sh);
      part.getContext("2d").drawImage(cv,0,sy,cv.width,sh,0,0,cv.width,sh);
      pdf.addImage(part.toDataURL("image/jpeg",.9),"JPEG",M,y,CW,sh*ratio); y+=sh*ratio; sy+=sh;
      if(sy<cv.height){ pdf.addPage(); page++; y=M; }
    }
  }
  const n=pdf.getNumberOfPages();
  for(let i=1;i<=n;i++){ pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(120); pdf.text(`Blueprint Coach  |  ${today()}  |  ${i} / ${n}`, PW/2, PH-16, {align:"center"}); }
  return pdf.output("blob");
}

  if(ds.act==="restAdd"){ if(S.live&&S.live.rest){ S.live.rest.until+=15000; S.live.rest.total+=15; S.live.rest.done=false; liveSave(); render(); } return; }
  if(ds.act==="restSkip"){ if(S.live){ const nx=S.live.rest&&S.live.rest.next; S.live.rest=null; if(nx) S.live.i++; liveSave(); render(); } return; }
  if(ds.act==="liveAddSet"){ const p=pEff(S.profile),L=S.live,k=dayList(p,L.k)[L.i],d=day(today()); const ss=((d.lifts||{})[k]||[]).slice(); const last=ss[ss.length-1]; if(last){ ss.push({...last}); d.lifts={...(d.lifts||{}),[k]:ss}; saveDay(today()); } render(); return; }
  if(ds.supp){ const d=day(today()); if(ds.supp==="creatine") d.chk={...(d.chk||{}),creatine:!(d.chk||{}).creatine}; else d.supp={...(d.supp||{}),[ds.supp]:!(d.supp||{})[ds.supp]}; saveDay(today()); render(); return; }
  if(ds.act==="wheyNew"){ S.profile.wheyStock=+S.profile.wheyServ||50; S.profile.wheyStockDate=today(); saveProfile(); toast("เริ่มนับเวย์กระปุกใหม่ "+S.profile.wheyStock+" Scoop"); render(); return; }
  if(ds.fadd){ addFood(ds.fadd); render(); return; }
  if(ds.fq){ const [i,dq]=ds.fq.split("|"); const d=day(today()); const f=(d.food||[]).slice(); const q=Math.max(0.5,(+f[+i].q||1)+(+dq)); f[+i]={...f[+i],q}; d.food=f; saveDay(today()); render(); return; }
  if(ds.fdel!=null){ const d=day(today()); d.food=(d.food||[]).filter((_,i)=>i!==+ds.fdel); saveDay(today()); render(); return; }
  if(ds.fcat){ S.foodCat=ds.fcat; S.foodQ=""; render(); return; }
  if(ds.act==="foodCustom"){ const n=$("#cf_n").value.trim(), k=+$("#cf_k").value, P=+$("#cf_P").value||0; if(!n||!(k>0)){ toast("ใส่ชื่อและแคลอรี่"); return; } addFood("custom",{n,k,P,u:"1 ที่"}); render(); return; }
  if(ds.mealeat){ const [type,idx]=ds.mealeat.split("|"); const m=mealPlan(S.profile,type)[+idx]; addFood("custom",{n:m.name+": "+m.tp.l,u:"ตามแผน",k:r0(m.t.k),P:r0(m.t.P),C:r0(m.t.C),F:r0(m.t.F)}); toast("เพิ่ม "+m.name+" แล้ว"); render(); return; }
  if(ds.act==="saveMeas"){ saveMeas(); return; }
  if(ds.phpose){ S.phPose=ds.phpose; S.phA=S.phB=null; render(); return; }
  if(ds.act==="phAdd"){ $("#phFile").click(); return; }
  if(ds.phdel){ const [d,pose]=ds.phdel.split("|"); photoDel((PID==="main"?"":PID+":")+d+"|"+pose).then(async()=>{ PH=null; await loadPhotos(); render(); }); return; }
  if(ds.act==="saveCardio"){ saveCardio(); return; }
  if(ds.cdel!=null){ const d=day(today()); d.cardio=(d.cardio||[]).filter((_,i)=>i!==+ds.cdel); saveDay(today()); render(); return; }
  if(ds.act==="ics"){ exportICS(); return; }
  if(ds.act==="aiMachine"){ aiMachineModal(); return; }
  if(ds.act==="plate"){ plateModal(); return; }
  if(ds.act==="platePick"){ $("#plateFile").click(); return; }
  if(ds.platei!=null){ plateShow(PLATE[+ds.platei][1]); return; }
  if(ds.act==="aiMachinePick"){ $("#aiMachineFile").click(); return; }
  if(ds.act==="aiFood"){ aiFoodModal(); return; }
  if(ds.act==="aiFoodPick"){ $("#aiFoodFile").click(); return; }
  if(ds.act==="aiFoodAdd"){ (S.aiFoodItems||[]).forEach((x,i)=>{ const cb=$("#aif"+i); if(cb&&cb.checked) addFood("ai",{n:x.name,u:x.portion||"",k:r0(+x.kcal||0),P:r0(+x.P||0),C:r0(+x.C||0),F:r0(+x.F||0)}); }); $("#modalRoot").innerHTML=""; toast("เพิ่มลงบันทึกอาหารแล้ว"); render(); return; }
  if(ds.act==="coach"){ coachModal(); return; }
  if(ds.act==="chatSend"){ chatSend($("#chatIn").value); return; }
  if(ds.chatq){ chatSend(ds.chatq); return; }
  if(ds.act==="chatClear"){ S.chat=[]; coachModal(); return; }
  if(ds.act==="scanPick"){ $("#scanFile").click(); return; }
  if(ds.act==="scanManual"){ S.scanDraft={date:today()}; S.scanApply=true; S.scanMsg=null; render(); return; }
  if(ds.act==="scanCancel"){ S.scanDraft=null; S.scanMsg=null; render(); return; }
  if(ds.act==="scanSave"){ scanSave(); return; }
  if(ds.scandel){ const x=S.days[ds.scandel]; if(x){ delete x.scan; saveDay(ds.scandel); } render(); return; }
  if(ds.act==="export"){ exportJSON(); return; }
  if(ds.act==="pdf"){ exportPDF(); return; }
  if(ds.act==="pdfMake"){ pdfMake(); return; }
  if(ds.act==="pdfShare"){ pdfShare(); return; }
  if(ds.act==="printNow"){ document.body.classList.add("printing"); setTimeout(()=>{ window.print(); },50); return; }
  if(ds.act==="closeReport"){ const R=$("#report"); R.innerHTML=""; R.className=""; R.setAttribute("aria-hidden","true"); return; }
  if(ds.act==="import"){ $("#impFile").click(); return; }
  if(ds.act==="reset"){ S.confirmReset=true; render(); return; }
  if(ds.act==="resetNo"){ S.confirmReset=false; render(); return; }
  if(ds.act==="resetYes"){ const ks=Object.keys(S.days); S.days={}; S.confirmReset=false; saveLocal();
    if(online) ks.forEach(k=>DB.doc(ppath()).collection("days").doc(k).delete().catch(()=>{})); render(); return; }
});
document.addEventListener("change", ev=>{
  const el=ev.target;
  if(el.id==="tD"){ S.trackDate=el.value; render(); return; }
  if(el.id==="mD"){ S.measDate=el.value; render(); return; }
  if(/^rd_/.test(el.id||"")){ const d=day(today()); const k=el.id.slice(3); const v=el.value; d.ready={...(d.ready||{}),[k]: k==="pain"? v : (v===""?null:+v)}; saveDay(today()); render(); return; }
  if(el.id==="rotateEx"){ S.profile.rotate=el.checked; saveProfile(); render(); return; }
  if(el.id==="phFile" && el.files && el.files[0]){ addPhoto(el.files[0]); el.value=""; return; }
  if(el.id==="phA"){ S.phA=el.value; render(); return; }
  if(el.id==="phB"){ S.phB=el.value; render(); return; }
  if(el.id==="aiMachineFile" && el.files && el.files[0]){ aiMachine(el.files[0]); return; }
  if(el.id==="plateFile" && el.files && el.files[0]){ plateRead(el.files[0]); return; }
  if(el.id==="aiFoodFile" && el.files && el.files[0]){ aiFood(el.files[0]); return; }
  if(/^sp_/.test(el.id||"")){ S.profile.suppOn={...(S.profile.suppOn||{}),[el.id.slice(3)]:el.checked}; saveProfile(); return; }
  if(el.id==="scanFile" && el.files && el.files.length){ readScanFiles([...el.files]); return; }
  if(el.id==="sc_apply"){ S.scanApply=el.checked; return; }
  if(el.id && el.id.startsWith("sc_") && S.scanDraft){ S.scanDraft[el.id==="sc_date"?"date":el.id.slice(3)] = el.value; return; }
  if(el.id==="impFile" && el.files && el.files[0]){ const fr=new FileReader();
    fr.onload=()=>{ try{ const j=JSON.parse(fr.result);
        if(!j || typeof j!=="object" || (!j.profile && !j.days)) throw 0;
        if(j.profile) S.profile={...DEFAULT_PROFILE,...j.profile};
        if(j.picks) S.picks={...j.picks};
        if(j.days && typeof j.days==="object") S.days={...S.days,...j.days};
        saveLocal();
        if(online){ DB.doc(ppath()).set({profile:S.profile,picks:S.picks}).catch(syncErr);
          Object.keys(j.days||{}).forEach(k=>DB.doc(ppath()).collection("days").doc(k).set(S.days[k]).catch(syncErr)); }
        if(j.profile){ S.hasProfile=true; S.setup=null; }
        S.importMsg="นำเข้าแล้ว ("+Object.keys(j.days||{}).length+" วัน)";
      }catch(e){ S.importMsg="ไฟล์ไม่ถูกต้อง"; } render(); };
    fr.readAsText(el.files[0]); return; }
  if(el.id && el.id.startsWith("w_") && S.wiz){ S.wiz[el.id.slice(2)]=el.value; if(el.id==="w_sex"){ S.wiz.focus = el.value==="f"?"glutes":"vshape"; render(); } return; }
  if(/^p_cd\d$/.test(el.id||"")){ const i=+el.id.slice(4); let a=customDays(S.profile); a=el.checked?[...a,i]:a.filter(x=>x!==i); S.profile.customDays=[...new Set(a)].sort(); saveProfile(); render(); return; }
  if(el.id && el.id.startsWith("p_")){
    const k=el.id.slice(2); let v=el.value;
    if(k==="pattern" && v==="custom" && customDays(S.profile).length<2) S.profile.customDays=[0,1,3,4];
    if(["age","height","weight","bf","waist","days","weeks","wheyP","wheyK","wheyServ","coffee","duration"].includes(k)) v = v===""? (k==="bf"?null:S.profile[k]) : +v;
    if(k==="lactose"||k==="creatineLoad") v = el.value==="1";
    S.profile[k]=v; saveProfile(); render();
  }
});
document.addEventListener("input", ev=>{ const el=ev.target; if(el.id==="foodQ"){ S.foodQ=el.value; clearTimeout(timers.fq); timers.fq=setTimeout(()=>{ const pos=el.selectionStart; render(); const n=$("#foodQ"); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos);}catch(e){} } },250); return; } if(el.id && el.id.startsWith("w_") && S.wiz) S.wiz[el.id.slice(2)]=el.value; });
document.addEventListener("keydown", ev=>{ if(ev.key==="Enter" && ev.target && ev.target.id==="chatIn"){ ev.preventDefault(); chatSend(ev.target.value); return; } if(ev.key==="Escape"){ $("#modalRoot").innerHTML=""; const R=$("#report"); if(R.className==="on"){ R.innerHTML=""; R.className=""; } } });
window.addEventListener("afterprint", ()=>document.body.classList.remove("printing"));

S.hasProfile = loadLocal(); liveLoad();
if(!S.hasProfile && window.claude){ S.setup="wait"; render(); connect().finally(()=>{ S.setup = S.hasProfile? null : "on"; render(); }); }
else { S.setup = S.hasProfile? null : "on"; render(); connect(); }
})();
</script>
<script>if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>
</body>
