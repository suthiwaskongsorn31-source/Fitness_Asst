<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r0 = x => Math.round(x), r5 = x => Math.round(x/5)*5, r10 = x => Math.round(x/10)*10, r50=x=>Math.round(x/50)*50;
const fmt = x => Math.round(x).toLocaleString("en-US");
const ymd = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const today = () => ymd(new Date());
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a,b) => Math.round((parseD(b)-parseD(a))/86400000);
const TH_DAYS = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัส","ศุกร์","เสาร์"];
const TH_SHORT = ["อา.","จ.","อ.","พ.","พฤ.","ศ.","ส."];
const thDate = s => { const d=parseD(s); return d.getDate()+" "+["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."][d.getMonth()]; };

/* ---------- state + storage ---------- */
const DEFAULT_PROFILE = {
  name:"Suthiwas", sex:"m", age:40, height:176, weight:87, bf:23.4, waist:91,
  goal:"fat", pace:"normal", days:6, level:"inter", equip:"gym", session:"evening",
  mealMode:"office", lactose:false,
  wheyName:"BAAM ISO Zero Mocha", wheyP:30, wheyK:130, wheyServ:52,
  creatineLoad:true, weeks:12, start:"2026-10-01", coffee:3
};
const S = { profile:{...DEFAULT_PROFILE}, days:{}, picks:{}, dayType:null, tab:"today", trainSel:null, logOpen:{}, confirmReset:false, trackDate:null };
let DB=null, UID=null, online=false;
const LKEY="blueprint-coach-v1";
function loadLocal(){ try{ const j = JSON.parse(localStorage.getItem(LKEY)||"null"); if(j){ if(j.profile) S.profile={...DEFAULT_PROFILE,...j.profile}; if(j.days) S.days=j.days; if(j.picks) S.picks=j.picks; } }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LKEY, JSON.stringify({profile:S.profile, days:S.days, picks:S.picks})); }catch(e){} }
const timers={};
function debounce(key, fn, ms=700){ clearTimeout(timers[key]); timers[key]=setTimeout(fn, ms); }
function saveProfile(){ saveLocal(); if(online) debounce("profile", ()=> DB.doc("data/users/"+UID+"/profile").set({profile:S.profile, picks:S.picks}).catch(syncErr)); }
function saveDay(d){ saveLocal(); if(online) debounce("day-"+d, ()=> DB.doc("data/users/"+UID+"/profile").collection("days").doc(d).set(S.days[d]||{}).catch(syncErr)); }
function syncErr(){ online=false; setSync(); }
function setSync(){ $("#syncdot").classList.toggle("on", online); $("#synctxt").textContent = online ? "บันทึกในบัญชีของคุณ" : "บันทึกในเครื่องนี้"; }
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    DB=db; UID=id;
    const pref = DB.doc("data/users/"+UID+"/profile");
    const ps = await pref.get();
    if(ps.exists){ const d=ps.data()||{}; if(d.profile) S.profile={...DEFAULT_PROFILE,...d.profile}; if(d.picks) S.picks={...d.picks}; }
    const qs = await pref.collection("days").limit(1000).get();
    qs.docs.forEach(doc=>{ S.days[doc.id] = JSON.parse(JSON.stringify(doc.data()||{})); });
    online=true; setSync();
    // first time online: push local data up
    if(!ps.exists){ await pref.set({profile:S.profile, picks:S.picks}); for(const d of Object.keys(S.days)) await pref.collection("days").doc(d).set(S.days[d]); }
    saveLocal(); render();
  }catch(e){ online=false; setSync(); }
}
const day = d => (S.days[d] ||= {});

/* ---------- calculations ---------- */
function calc(p){
  const w=+p.weight||70, h=+p.height||170, a=+p.age||30, bf=+p.bf||0, male=p.sex!=="f";
  const lbm = bf>3 && bf<60 ? w*(1-bf/100) : null;
  const mifflin = 10*w + 6.25*h - 5*a + (male?5:-161);
  const bmr = lbm ? 370 + 21.6*lbm : mifflin;
  const days=+p.days||4;
  const act = {3:1.375,4:1.45,5:1.5,6:1.55}[days] || 1.45;
  const tdee = bmr*act;
  const paceAdj = {fat:{slow:-.15,normal:-.20,fast:-.25}, recomp:{slow:-.08,normal:-.10,fast:-.12}, gain:{slow:.05,normal:.10,fast:.15}, maintain:{slow:0,normal:0,fast:0}}[p.goal][p.pace];
  let target = tdee*(1+paceAdj);
  const floor = Math.max(bmr, male?1500:1200);
  if(target<floor) target=floor;
  const rest = days>=7 ? target : target-150;
  const train = days>=7 ? target : (7*target - (7-days)*rest)/days;
  const bmi = w/((h/100)**2);
  const protW = (bmi>30 && !lbm) ? (h-100) : w;   // adjusted weight for high BMI without BF
  const protPerKg = {fat:2.2, recomp:2.0, gain:1.8, maintain:1.8}[p.goal];
  const protein = lbm ? Math.min(protPerKg*w, 2.8*lbm) : protPerKg*protW;
  const macros = k => { const P=protein; const F=Math.max(0.6*w, k*0.27/9); const C=Math.max(0,(k-P*4-F*9)/4); return {k, P, C, F}; };
  const water = w*0.035 + 0.5;
  const hrMax = 220-a;
  const weeklyKg = (target - tdee)*7/7700;
  const capWeekly = p.goal==="fat" ? Math.max(weeklyKg, -0.01*w) : weeklyKg;
  const weeks=+p.weeks||12;
  let endW = w + capWeekly*weeks;
  let tgtBFw=null;
  if(lbm && (p.goal==="fat"||p.goal==="recomp")){ const tbf = male?15:24; tgtBFw = lbm/(1-tbf/100); }
  return { w,h,a,bf,male,lbm,bmr,mifflin,act,tdee,target,train,rest,protein,bmi,water,hrMax,
    z2:[r5(hrMax*.6), r5(hrMax*.7)], weeklyKg:capWeekly, endW, weeks, tgtBFw,
    trainM:macros(train), restM:macros(rest), method: lbm?"Katch-McArdle (ใช้ % ไขมัน)":"Mifflin-St Jeor" };
}
function progWeek(p){ const n = diffDays(p.start, today()); return Math.floor(n/7)+1; }
function deloadWeek(p){ return (+p.weeks>=10) ? Math.round(+p.weeks*0.58) : null; }

function roundStep(x, st){ return Math.max(0, Math.round(x/st)*st); }
function buildMeal(tp, tgt, F){
  const items={}; const add=(k,a)=>{ if(a>0) items[k]=(items[k]||0)+a; };
  const tot=()=>{ let k=0,P=0,C=0,Fa=0; for(const [id,a] of Object.entries(items)){ const f=F[id]; const m=a/f.per; k+=f.k*m;P+=f.P*m;C+=f.C*m;Fa+=f.F*m;} return {k,P,C,F:Fa}; };
  if(tp.veg) add("veg",1);
  if(tp.fix) for(const [k,a] of Object.entries(tp.fix)) add(k,a);
  const Fc=tp.c?F[tp.c]:null, Ff=tp.f?F[tp.f]:null;
  const estFatC = Ff ? Math.max(0,tgt.F-tot().F)*(Ff.C/Ff.F) : 0;
  const estCarbP = Fc ? Math.max(0,tgt.C-tot().C-estFatC)*(Fc.P/Fc.C) : 0;
  const estFatP = Ff ? Math.max(0,tgt.F-tot().F)*(Ff.P/Ff.F) : 0;
  if(tp.p){ const f=F[tp.p]; const need = tgt.P - tot().P - estCarbP - estFatP; let a = roundStep(need/f.P*f.per, f.step); a=Math.max(a, f.min); add(tp.p,a); }
  if(tp.c){ const f=F[tp.c]; const fatAfterP = Ff ? Math.max(0,tgt.F-tot().F)*(Ff.C/Ff.F) : 0; const need = tgt.C - tot().C - fatAfterP; add(tp.c, roundStep(need/f.C*f.per, f.step)); }
  if(tp.f){ const f=F[tp.f]; const need = tgt.F - tot().F; add(tp.f, roundStep(need/f.F*f.per, f.step)); }
  return {items, t:tot()};
}
function mealPlan(p, type){
  const c=calc(p), M= type==="train"? c.trainM : c.restM, F=foods(p);
  return slots(p,type).map(([key,name,time,fp,fc,ff],i)=>{
    let list = TPL[key].filter(t=>!(p.lactose && (t.lact || t.p==="yogurt")));
    if(!list.length) list=TPL[key];
    const pk = (S.picks[type+i]||0) % list.length;
    const tp = list[pk];
    const m = buildMeal(tp, {P:M.P*fp, C:M.C*fc, F:M.F*ff}, F);
    return {key,name,time,tp,idx:i,nopts:list.length,...m};
  });
}

function rxFor(p, k, idx){

  const t=today();

  const avg7=win(addDays(t,-7),t), prev7=win(addDays(t,-14),addDays(t,-7));

}
function exCard(p,k,i,date){
  const e=DATA.ex[k], rx=rxFor(p,k,i), last=lastLog(k, date||"9999");
  const top=topRep(rx.r), timed=/วิ/.test(rx.r);
  let hint="";
  if(last && !timed){ const hit=last.sets.length>=rx.s && last.sets.every(s=>+s.r>=top); const kgMax=Math.max(...last.sets.map(s=>+s.kg||0));
    hint = hit ? `<div class="hint">ครั้งก่อนทำครบ ${top} ครั้งทุกเซ็ต → เพิ่มน้ำหนัก 2–5% (ประมาณ ${(Math.round(kgMax*1.04*2)/2)} kg)</div>` : `<div class="hint same">ครั้งก่อน ${last.sets.map(s=>`${s.kg||0}×${s.r||0}`).join(", ")} → ใช้น้ำหนักเดิม เพิ่มจำนวนครั้ง</div>`; }
  const open=S.logOpen[k] && date;
  const cur = date ? ((day(date).lifts||{})[k]||[]) : [];
  return `<article class="ex"><button class="fig" data-howto="${k}" aria-label="วิธีทำ ${esc(e.n)}" style="padding:0;border:1px solid var(--line)">${DATA.fig[k]}</button>
   <div style="min-width:0;display:grid;gap:4px">
     <div class="row" style="justify-content:space-between;gap:6px"><h3>${i+1}. ${esc(e.n)}</h3><span class="sr">${rx.s} × ${esc(rx.r)}</span></div>
     <div class="tiny">${esc(e.p.join(" · "))}</div>${hint}
     <div class="row"><button class="btn" data-howto="${k}">วิธีทำ / กล้ามเนื้อ</button>${date&&!timed?`<button class="btn ${cur.length?"":"pri"}" data-log="${k}">${open?"ปิด":(cur.length?`บันทึกแล้ว ${cur.length} เซ็ต`:"บันทึกเซ็ต")}</button>`:""}</div>
     ${open?logForm(k,rx,cur,last):""}
   </div></article>`;
}
function logForm(k,rx,cur,last){
  const rows=[]; for(let s=0;s<rx.s;s++){ const v=cur[s]||{}; const pv=last?.sets?.[s]||{};
    rows.push(`<div class="setrow"><span class="tiny">เซ็ต ${s+1}</span><input inputmode="decimal" type="number" step="0.5" data-kg="${k}:${s}" value="${v.kg??""}" placeholder="${pv.kg??"kg"}" aria-label="น้ำหนักเซ็ต ${s+1}"><input inputmode="numeric" type="number" data-rp="${k}:${s}" value="${v.r??""}" placeholder="${pv.r??"ครั้ง"}" aria-label="จำนวนครั้งเซ็ต ${s+1}"></div>`); }
  return `<div class="sets"><div class="setrow tiny"><span></span><span>kg</span><span>ครั้ง</span></div>${rows.join("")}<div class="row"><button class="btn pri" data-savelog="${k}">บันทึก</button><span class="tiny">ช่องว่าง = ค่าครั้งก่อน (ตัวจาง)</span></div></div>`;
}

function chart(p,c,tr){
  const W=520,H=260,L=40,R=14,T=14,B=28;
  const start=p.start, end=addDays(start, (+p.weeks)*7);
  const pts=tr.vals.filter(v=>v.d>=addDays(start,-14));
  const all=[...pts.map(x=>x.w), +p.weight, c.endW];
  let lo=Math.floor(Math.min(...all)-1), hi=Math.ceil(Math.max(...all)+1);
  const x0=parseD(addDays(start,-3)), x1=parseD(end);
  const X=d=>L+(parseD(d)-x0)/(x1-x0)*(W-L-R), Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const ticks=[]; const st=Math.max(1,Math.ceil((hi-lo)/5)); for(let v=lo; v<=hi; v+=st) ticks.push(v);
  const avg=pts.map((x,i)=>{ const win=pts.filter(y=>y.d<=x.d && y.d>addDays(x.d,-7)); return {d:x.d, w:win.reduce((s,y)=>s+y.w,0)/win.length}; });
  const path=a=>a.map((x,i)=>(i?"L":"M")+X(x.d).toFixed(1)+","+Y(x.w).toFixed(1)).join("");
  const xt=[]; for(let i=0;i<=+p.weeks;i+=Math.max(1,Math.round(+p.weeks/6))) xt.push(i);
  const td=today();
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟน้ำหนัก">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="13" fill="var(--ink3)" font-family="IBM Plex Mono,monospace">${v}</text>`).join("")}
    ${xt.map(i=>`<text x="${X(addDays(start,i*7))}" y="${H-8}" text-anchor="middle" font-size="13" fill="var(--ink3)">W${i}</text>`).join("")}
    <line x1="${X(start)}" y1="${Y(+p.weight)}" x2="${X(end)}" y2="${Y(c.endW)}" stroke="var(--gold)" stroke-width="2" stroke-dasharray="6 5"/>
    ${td>=start&&td<=end?`<line x1="${X(td)}" x2="${X(td)}" y1="${T}" y2="${H-B}" stroke="var(--ink3)" stroke-width="1" stroke-dasharray="2 3"/>`:""}
    ${pts.map(x=>`<circle cx="${X(x.d)}" cy="${Y(x.w)}" r="3" fill="var(--ink3)" opacity=".7"/>`).join("")}
    ${avg.length>1?`<path d="${path(avg)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`:""}
    ${avg.length?`<circle cx="${X(avg[avg.length-1].d)}" cy="${Y(avg[avg.length-1].w)}" r="5" fill="var(--accent)"/>`:""}
    ${!pts.length?`<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="13" fill="var(--ink3)">บันทึกน้ำหนักวันแรกเพื่อเริ่มกราฟ</text>`:""}
  </svg>`;
}

  </div></section>
  <section class="card"><h2>อาหารเสริม & ข้อจำกัด</h2><div class="form">

    <label class="f">Load Creatine สัปดาห์แรก${opt("p_creatineLoad",p.creatineLoad?1:0,[[1,"ใช่ (20 g/วัน 7 วัน)"],[0,"ไม่ (5 g/วัน)"]])}</label>

  </dl><p class="tiny" style="margin-top:6px">เป็นค่าประมาณจากสูตรมาตรฐาน · ใช้ 2–3 สัปดาห์แล้วปรับตามน้ำหนักจริงจากหน้าติดตาม · ผู้มีโรคประจำตัวควรปรึกษาแพทย์</p></section>
  <section class="card"><h2>ข้อมูล</h2><p class="small muted">${online?"บันทึกในบัญชีของคุณ เปิดจากอุปกรณ์อื่นที่ล็อกอินบัญชีเดียวกันได้ · ข้อมูลเป็นส่วนตัว คนที่เปิดลิงก์นี้จะเห็นเฉพาะของตัวเอง":"บันทึกในเบราว์เซอร์นี้เท่านั้น · กดสำรองข้อมูลเก็บไว้เป็นระยะ เผื่อล้างเบราว์เซอร์หรือย้ายเครื่อง"}</p>

/* ---------- PDF report ---------- */
const RCOL={"--line":"#d9dfe9","--ink3":"#6b7489","--gold":"#fca311","--accent":"#e85d04","--ink":"#14213d"};
const fixVars = svg => svg.replace(/var\((--[a-z0-9-]+)\)/g,(m,k)=>RCOL[k]||"#888").replace(/font-family="[^"]*"/g,"");
const e1rm = s => (+s.kg||0)*(1+(+s.r||0)/30);
const bestSet = sets => sets.reduce((b,s)=> (!b||e1rm(s)>e1rm(b))?s:b, null);
const CHK=[["protein","โปรตีน"],["water","น้ำ"],["steps","ก้าวเดิน"],["creatine","Creatine"],["workout","ซ้อม"],["sleep","นอน"]];
function reportHTML(){
  const p=S.profile, c=calc(p), tr=trend(), td=today(), wk=progWeek(p), F=foods(p);
  const dKeys=Object.keys(S.days).sort();
  const first=tr.vals[0], last=tr.vals[tr.vals.length-1];
  const startW = first? first.w : +p.weight;
  const curW = tr.avg7 ?? (last? last.w : +p.weight);
  const dW = curW-startW;
  const waists=dKeys.filter(d=>S.days[d].waist).map(d=>({d,v:+S.days[d].waist}));
  const wa0=waists[0], wa1=waists[waists.length-1];
  const elapsed=Math.max(0,Math.min(diffDays(p.start,td)+1, +p.weeks*7));
  const chkDays=dKeys.filter(d=>d>=p.start&&d<=td);
  const chkCnt=k=>chkDays.filter(d=>(S.days[d].chk||{})[k]).length;
  const totalChk=CHK.reduce((a,[k])=>a+chkCnt(k),0);
  const adh = elapsed? totalChk/(elapsed*6)*100 : 0;
  const liftDays=dKeys.filter(d=>S.days[d].lifts && Object.values(S.days[d].lifts).some(a=>a&&a.length));
  const sign=x=>(x>0?"+":"")+x.toFixed(1);
  const pct=(a,b)=>b? Math.round(a/b*100):0;
  const plan=weekPlan(p);
  const sec=(h,body,cls="")=>`<section class="rsec ${cls}">${h?`<h2>${h}</h2>`:""}${body}</section>`;
  const out=[];

  // header
  out.push(sec("",`<div class="rhead"><div class="brand">BLUEPRINT COACH · รายงานสรุปผล</div>
    <h1>${esc(p.name||"ผู้ใช้")} · ${esc(goalText(p))}</h1>
    <div class="meta">สร้างเมื่อ ${thDate(td)} ${parseD(td).getFullYear()+543} · โปรแกรม ${p.weeks} สัปดาห์ เริ่ม ${thDate(p.start)} · ${wk<1?"ยังไม่เริ่ม":wk>+p.weeks?"จบโปรแกรมแล้ว":"สัปดาห์ที่ "+wk+" / "+p.weeks} · ${esc(phaseOf(p))}</div>
    <div class="meta">${p.sex==="f"?"หญิง":"ชาย"} · อายุ ${p.age} ปี · ส่วนสูง ${p.height} cm · ${p.equip==="gym"?"ฟิตเนส":"ที่บ้าน"} ${p.days} วัน/สัปดาห์ · ${{begin:"มือใหม่",inter:"ระดับกลาง",adv:"ขั้นสูง"}[p.level]}</div></div>`));

  // KPIs
  out.push(sec("1. สรุปผลลัพธ์",`<div class="kpis">
    <div class="kpi"><b>${startW.toFixed(1)}</b><span>น้ำหนักเริ่มต้น (kg)${first?" · "+thDate(first.d):" · จากโปรไฟล์"}</span></div>
    <div class="kpi"><b>${curW.toFixed(1)}</b><span>น้ำหนักปัจจุบัน (kg)${tr.avg7!=null?" · เฉลี่ย 7 วัน":""}</span></div>
    <div class="kpi ${dW<0&&p.goal!=="gain"?"good":(dW>0&&p.goal==="gain"?"good":"")}"><b>${sign(dW)}</b><span>เปลี่ยนแปลงรวม (kg)</span></div>
    <div class="kpi"><b>${tr.rate!=null?sign(tr.rate):"—"}</b><span>อัตราต่อสัปดาห์ (kg)</span></div>
    <div class="kpi"><b>${wa1?wa1.v:"—"}</b><span>รอบเอวล่าสุด (cm)</span></div>
    <div class="kpi ${wa0&&wa1&&wa1.v<wa0.v?"good":""}"><b>${wa0&&wa1&&wa0!==wa1?sign(wa1.v-wa0.v):"—"}</b><span>รอบเอวเปลี่ยน (cm)</span></div>
    <div class="kpi"><b>${liftDays.length}</b><span>วันที่บันทึกการเวท</span></div>
    <div class="kpi"><b>${Math.round(adh)}%</b><span>ทำเช็กลิสต์ครบ · ต่อเนื่อง ${streak()} วัน</span></div>
  </div>
  <div class="radv"><b>คำแนะนำปรับแผน:</b> ${esc(advice().t)}</div>
  <p class="rnote">บันทึกน้ำหนัก ${tr.n} วัน · ผ่านมา ${elapsed} วันจาก ${p.weeks*7} วัน · Creatine ทำให้น้ำหนักบนตาชั่งสูงขึ้น 1–2 kg จากน้ำในกล้ามเนื้อ ให้ใช้รอบเอวและรูปถ่ายเป็นตัวตัดสินหลัก</p>`));

  // chart
  out.push(sec("2. กราฟน้ำหนัก",`<div style="border:1px solid var(--line);border-radius:10px;padding:6px">${fixVars(chart(p,c,tr))}</div>
    <p class="rnote">จุด = น้ำหนักรายวัน · เส้นส้ม = ค่าเฉลี่ย 7 วัน · เส้นประเหลือง = เส้นทางเป้าหมาย (${c.weeklyKg>0?"+":""}${c.weeklyKg.toFixed(2)} kg/สัปดาห์ → ${c.endW.toFixed(1)} kg)</p>`));

  // weekly table
  const rows=[]; let prevAvg=null;
  for(let i=0;i<Math.min(+p.weeks,26);i++){ const a=addDays(p.start,i*7), b=addDays(a,6); if(a>td) break;
    const ds=dKeys.filter(x=>x>=a&&x<=b);
    const v=ds.filter(x=>S.days[x].w).map(x=>+S.days[x].w); const avg=v.length?v.reduce((s,x)=>s+x,0)/v.length:null;
    const wa=ds.filter(x=>S.days[x].waist).map(x=>+S.days[x].waist);
    const nd=Math.min(7,diffDays(a,td)+1);
    const ck=ds.reduce((s,x)=>s+Object.values(S.days[x].chk||{}).filter(Boolean).length,0);
    const lifts=ds.filter(x=>S.days[x].lifts&&Object.values(S.days[x].lifts).some(q=>q&&q.length)).length;
    rows.push(`<tr><td>${i+1}</td><td>${thDate(a)} – ${thDate(b)}</td><td class="n">${avg?avg.toFixed(1):"—"}</td><td class="n">${avg&&prevAvg?sign(avg-prevAvg):"—"}</td><td class="n">${v.length?Math.min(...v).toFixed(1)+"–"+Math.max(...v).toFixed(1):"—"}</td><td class="n">${wa.length?wa[wa.length-1]:"—"}</td><td class="n">${lifts}</td><td class="n">${pct(ck,nd*6)}%</td><td style="font-size:10.5px;color:var(--ink3)">${i===0&&p.creatineLoad?"Load Creatine":""}${[4,8,12].includes(i+1)?"สแกน Evolt":""}${deloadWeek(p)===i+1?" Deload":""}</td></tr>`);
    if(avg) prevAvg=avg; }
  out.push(sec("3. สรุปรายสัปดาห์",`<table><thead><tr><th>สัปดาห์</th><th>ช่วงวันที่</th><th class="n">เฉลี่ย (kg)</th><th class="n">เปลี่ยน</th><th class="n">ต่ำสุด–สูงสุด</th><th class="n">เอว (cm)</th><th class="n">วันเวท</th><th class="n">เช็กลิสต์</th><th>หมายเหตุ</th></tr></thead>
    <tbody>${rows.join("")||`<tr><td colspan="9">ยังไม่มีข้อมูล</td></tr>`}</tbody></table>`,"long"));

  // checklist adherence
  out.push(sec("4. วินัยรายวัน (เช็กลิสต์)",`<table><thead><tr><th>หัวข้อ</th><th class="n">ทำได้ (วัน)</th><th class="n">จาก (วัน)</th><th class="n">%</th><th style="width:40%">ระดับ</th></tr></thead><tbody>
    ${CHK.map(([k,l])=>{const n=chkCnt(k), q=pct(n,elapsed); return `<tr><td>${l}</td><td class="n">${n}</td><td class="n">${elapsed}</td><td class="n">${q}%</td><td><div style="height:9px;border-radius:5px;background:#eef1f6"><div style="height:9px;border-radius:5px;width:${Math.min(100,q)}%;background:${q>=80?"#2a9d8f":q>=50?"#fca311":"#c1121f"}"></div></div></td></tr>`;}).join("")}
  </tbody></table><p class="rnote">นับตั้งแต่วันเริ่มโปรแกรมถึงวันนี้ · เป้าหมายคือทุกหัวข้อเกิน 80%</p>`));

  // targets
  out.push(sec("5. เป้าหมายพลังงาน & สารอาหาร",`<div class="rgrid2"><table><tbody>
    <tr><td>BMR</td><td class="n">${fmt(c.bmr)} kcal</td></tr>
    <tr><td>สูตร</td><td class="n">${c.method}</td></tr>
    <tr><td>กิจกรรม</td><td class="n">× ${c.act}</td></tr>
    <tr><td>TDEE</td><td class="n">${fmt(c.tdee)} kcal</td></tr>
    <tr><td>เป้าเฉลี่ย</td><td class="n">${fmt(c.target)} kcal</td></tr>
    <tr><td>มวลไร้ไขมัน</td><td class="n">${c.lbm?c.lbm.toFixed(1)+" kg":"—"}</td></tr>
    <tr><td>BMI</td><td class="n">${c.bmi.toFixed(1)}</td></tr></tbody></table>
    <table><tbody>
    <tr><td>น้ำ</td><td class="n">${c.water.toFixed(1)} ลิตร/วัน</td></tr>
    <tr><td>Zone 2</td><td class="n">${c.z2[0]}–${c.z2[1]} ครั้ง/นาที</td></tr>
    <tr><td>คาดการณ์จบโปรแกรม</td><td class="n">${c.endW.toFixed(1)} kg</td></tr>
    <tr><td>อัตราเป้าหมาย</td><td class="n">${c.weeklyKg.toFixed(2)} kg/สัปดาห์</td></tr>
    ${c.tgtBFw?`<tr><td>น้ำหนักที่ไขมัน ${c.male?15:24}%</td><td class="n">${c.tgtBFw.toFixed(1)} kg</td></tr>`:""}
    <tr><td>% ไขมัน (โปรไฟล์)</td><td class="n">${p.bf??"—"}%</td></tr>
    <tr><td>รอบเอว (โปรไฟล์)</td><td class="n">${p.waist??"—"} cm</td></tr></tbody></table></div>
    <h3>แมโครต่อวัน</h3><table><thead><tr><th>ประเภทวัน</th><th class="n">kcal</th><th class="n">โปรตีน</th><th class="n">คาร์บ</th><th class="n">ไขมัน</th></tr></thead><tbody>
    ${[["วันซ้อม",c.trainM],["วันพัก",c.restM]].map(([l,M])=>`<tr><td>${l}</td><td class="n">${fmt(M.k)}</td><td class="n">${r0(M.P)} g (${r0(M.P*4/M.k*100)}%)</td><td class="n">${r0(M.C)} g (${r0(M.C*4/M.k*100)}%)</td><td class="n">${r0(M.F)} g (${r0(M.F*9/M.k*100)}%)</td></tr>`).join("")}
    </tbody></table><p class="rnote">โปรตีน ${{fat:2.2,recomp:2.0,gain:1.8,maintain:1.8}[p.goal]} g/kg${c.lbm?" (ไม่เกิน 2.8 g/kg มวลไร้ไขมัน)":""} · ไขมัน ~27% ของพลังงาน · ที่เหลือเป็นคาร์บ · ปรับตามแนวโน้มน้ำหนักจริงทุก 2–3 สัปดาห์</p>`));

  // meal plans
  for(const type of ["train","rest"]){
    const pl=mealPlan(p,type); const tot=pl.reduce((a,m)=>({k:a.k+m.t.k,P:a.P+m.t.P,C:a.C+m.t.C,F:a.F+m.t.F}),{k:0,P:0,C:0,F:0});
    out.push(sec(`${type==="train"?"6":"7"}. แผนอาหาร${type==="train"?"วันซ้อม":"วันพัก"} <small>${type==="train"?({office:"วันทำงาน ไม่มีมื้อเย็น",5:"5 มื้อ",4:"4 มื้อ",3:"3 มื้อ"}[p.mealMode]||""):"4 มื้อ"}</small>`,
      `<table><thead><tr><th style="width:22%">มื้อ / เวลา</th><th>เมนู & ปริมาณ</th><th class="n">kcal</th><th class="n">P</th><th class="n">C</th><th class="n">F</th></tr></thead><tbody>
      ${pl.map(m=>`<tr><td><b>${esc(m.name)}</b><br><span style="color:var(--ink3);font-size:10.5px">${esc(m.time)}</span></td><td><b>${esc(m.tp.l)}</b><br>${Object.entries(m.items).map(([id,a])=>{const f=F[id]; return esc(f.n)+" "+(f.u==="g"?fmt(a)+" g":(Math.round(a*100)/100)+" "+f.u);}).join(" · ")}</td><td class="n">${fmt(m.t.k)}</td><td class="n">${r0(m.t.P)}</td><td class="n">${r0(m.t.C)}</td><td class="n">${r0(m.t.F)}</td></tr>`).join("")}
      <tr class="tot"><td colspan="2">รวม (เป้า ${fmt((type==="train"?c.trainM:c.restM).k)} kcal)</td><td class="n">${fmt(tot.k)}</td><td class="n">${r0(tot.P)}</td><td class="n">${r0(tot.C)}</td><td class="n">${r0(tot.F)}</td></tr></tbody></table>`));
  }

  // supplements
  const wheyUse=mealPlan(p,"train").reduce((a,m)=>a+(m.items.whey||0),0);
  const caf=(+p.coffee||0)*150;
  out.push(sec("8. อาหารเสริม & เวลา",`<table><thead><tr><th style="width:24%">รายการ</th><th>ขนาด / วิธีใช้</th><th style="width:20%">สถานะ</th></tr></thead><tbody>
    <tr><td>เวย์ · ${esc(p.wheyName)}</td><td>${Math.round(wheyUse*100)/100} Scoop ในวันซ้อม (${p.wheyP} g โปรตีน/Scoop) · 1 กระปุกอยู่ได้ ~${wheyUse?Math.round((+p.wheyServ||50)/wheyUse):"—"} วัน</td><td>จำเป็น</td></tr>
    <tr><td>Creatine Monohydrate</td><td>${esc(creatineToday(p).short)} · ทุกวันรวมวันพัก · ผสมน้ำหรือเวย์ได้</td><td>จำเป็น</td></tr>
    <tr><td>Multivitamin</td><td>1 เม็ดพร้อมมื้อเช้า</td><td>เสริม</td></tr>
    <tr><td>Calcium + D3 + K2</td><td>1 เม็ดพร้อมมื้อกลางวัน (แยกเวลาจาก Zinc/Mg)</td><td>เสริม</td></tr>
    <tr><td>Magnesium Bisglycinate</td><td>2 เม็ดก่อนนอน</td><td>เสริม</td></tr>
    <tr><td>น้ำมันปลา</td><td>ถ้ากินปลาทะเลน้อยกว่า 2 ครั้ง/สัปดาห์ · พร้อมอาหาร</td><td>ทางเลือก</td></tr>
    <tr><td>คาเฟอีน</td><td>~${fmt(caf)} mg/วัน จากกาแฟ ${p.coffee} แก้ว${caf>400?" · เกินเพดานทั่วไป 400 mg":""} · งดหลัง 14:00 ถ้านอนไม่หลับ</td><td>เฝ้าระวัง</td></tr>
  </tbody></table><p class="rnote">ไม่จำเป็น: BCAA, EAA, HMB, L-Carnitine, L-Arginine, Fat Burner · ${p.lactose?"แพ้แลคโตส: ใช้เวย์ Isolate":"รับแลคโตสได้"}</p>`));

  // training plan
  const wkRows=plan.map((k,i)=>`<tr><td>${TH_DAYS[(i+1)%7]}</td><td><b>${esc(DAYNAME[k])}</b>${(k==="C"||k==="CM")?`<br><span style="font-size:10.5px">${esc(cardioRx(p,k))}</span>`:(k!=="R"?`<br><span style="font-size:10.5px">${PROG[p.equip][k].map(x=>esc(DATA.ex[x].n)).join(" · ")}</span>`:"")}</td></tr>`).join("");
  out.push(sec("9. ตารางฝึกประจำสัปดาห์",`<table><thead><tr><th style="width:14%">วัน</th><th>โปรแกรม</th></tr></thead><tbody>${wkRows}</tbody></table>
    <p class="rnote">วอร์มอัพ 5–10 นาที · พักเซ็ต 60–90 วินาที · เหลือแรง 1–2 ครั้ง · หลังเวท: ${esc(cardioRx(p,"post"))}${deloadWeek(p)?" · สัปดาห์ "+deloadWeek(p)+" = Deload ลดเซ็ตครึ่งหนึ่ง":""}</p>`));
  [...new Set(plan.filter(k=>PROG[p.equip][k]))].forEach(k=>{
    out.push(sec(`ท่าฝึก · ${esc(DAYNAME[k])}`,`<table><thead><tr><th></th><th>ท่า</th><th class="n">เซ็ต × ครั้ง</th><th>กล้ามเนื้อหลัก / รอง</th><th>จุดสำคัญ</th></tr></thead><tbody>
      ${PROG[p.equip][k].map((x,i)=>{const e=DATA.ex[x], rx=rxFor(p,x,i); return `<tr><td class="rfig">${DATA.fig[x]}</td><td><b>${i+1}. ${esc(e.n)}</b><br><span style="font-size:10.5px;color:var(--ink3)">${esc(e.th)}</span></td><td class="n">${rx.s} × ${esc(rx.r)}</td><td>${esc(e.p.join(", "))}${e.sec&&e.sec.length?`<br><span style="font-size:10.5px;color:var(--ink3)">${esc(e.sec.join(", "))}</span>`:""}</td><td style="font-size:10.5px">${esc(e.feel?("รู้สึกที่: "+e.feel):"")}${e.m&&e.m[0]?`<br><span style="color:var(--bad)">ผิด: ${esc(e.m[0][0])} → ${esc(e.m[0][1])}</span>`:""}</td></tr>`;}).join("")}
    </tbody></table>`));
  });

  // lift progress
  const keys=[...new Set(dKeys.flatMap(d=>Object.keys(S.days[d].lifts||{}).filter(k=>(S.days[d].lifts[k]||[]).length)))];
  const lrows=keys.map(k=>{ const ds=dKeys.filter(d=>((S.days[d].lifts||{})[k]||[]).length);
    const f=bestSet(S.days[ds[0]].lifts[k]), l=bestSet(S.days[ds[ds.length-1]].lifts[k]);
    const vol=S.days[ds[ds.length-1]].lifts[k].reduce((a,s)=>a+(+s.kg||0)*(+s.r||0),0);
    const ch=e1rm(f)? (e1rm(l)/e1rm(f)-1)*100 : 0;
    return `<tr><td><b>${esc(DATA.ex[k]?.n||k)}</b></td><td class="n">${ds.length}</td><td class="n">${f.kg}×${f.r}<br><span style="font-size:10px;color:var(--ink3)">${thDate(ds[0])}</span></td><td class="n">${l.kg}×${l.r}<br><span style="font-size:10px;color:var(--ink3)">${thDate(ds[ds.length-1])}</span></td><td class="n">${e1rm(l).toFixed(1)}</td><td class="n" style="color:${ch>0?"#2a9d8f":ch<0?"#c1121f":"inherit"}">${ds.length>1?(ch>0?"+":"")+ch.toFixed(1)+"%":"—"}</td><td class="n">${fmt(vol)}</td></tr>`; });
  out.push(sec("10. พัฒนาการความแข็งแรง",keys.length?`<table><thead><tr><th>ท่า</th><th class="n">ครั้งที่บันทึก</th><th class="n">เซ็ตดีสุดครั้งแรก</th><th class="n">เซ็ตดีสุดล่าสุด</th><th class="n">1RM ประมาณ (kg)</th><th class="n">เปลี่ยน</th><th class="n">Volume ล่าสุด</th></tr></thead><tbody>${lrows.join("")}</tbody></table>
    <p class="rnote">1RM ประมาณด้วยสูตร Epley (น้ำหนัก × (1 + ครั้ง/30)) · ช่วงลดไขมัน ถ้าความแข็งแรงคงที่หรือขึ้น แปลว่ากล้ามเนื้อยังอยู่ครบ</p>`:`<p>ยังไม่มีบันทึกการยกน้ำหนัก · บันทึกได้ที่แท็บ "ฝึก" → "บันทึกเซ็ต"</p>`,"long"));

  // daily log
  const recent=dKeys.filter(d=>d>=addDays(td,-34)&&d<=td).reverse().filter(d=>{const x=S.days[d]; return x.w||x.waist||Object.values(x.chk||{}).some(Boolean)||(x.lifts&&Object.keys(x.lifts).length);});
  out.push(sec("11. บันทึกรายวัน (35 วันล่าสุด)",recent.length?`<table><thead><tr><th>วันที่</th><th>โปรแกรม</th><th class="n">น้ำหนัก</th><th class="n">เอว</th>${CHK.map(([,l])=>`<th class="n">${l}</th>`).join("")}<th class="n">ท่าที่บันทึก</th></tr></thead><tbody>
    ${recent.map(d=>{const x=S.days[d], k=plan[(parseD(d).getDay()+6)%7]; return `<tr><td>${TH_SHORT[parseD(d).getDay()]} ${thDate(d)}</td><td>${k==="R"?"พัก":(k==="C"||k==="CM")?"คาร์ดิโอ":k}</td><td class="n">${x.w??"—"}</td><td class="n">${x.waist??"—"}</td>${CHK.map(([kk])=>`<td class="n">${(x.chk||{})[kk]?"✓":"·"}</td>`).join("")}<td class="n">${Object.values(x.lifts||{}).filter(a=>a&&a.length).length||"—"}</td></tr>`;}).join("")}
    </tbody></table>`:`<p>ยังไม่มีบันทึก</p>`,"long"));

  // rules
  out.push(sec("12. หลักที่ต้องทำต่อ",`<ul>
    <li>ชั่งน้ำหนักทุกเช้าหลังเข้าห้องน้ำ ก่อนกินดื่ม · ดูค่าเฉลี่ย 7 วัน ไม่ดูรายวัน</li>
    <li>วัดรอบเอวระดับสะดือทุกวันอาทิตย์ · ถ่ายรูปหน้า/ข้าง/หลัง ทุก 2 สัปดาห์ แสงและมุมเดิม</li>
    <li>โปรตีน ${r0(c.protein)} g ทุกวัน รวมวันพัก · น้ำ ${c.water.toFixed(1)} ลิตร · เดิน 8,000–10,000 ก้าว</li>
    <li>เพิ่มน้ำหนักเมื่อทำครบจำนวนครั้งสูงสุดทุกเซ็ต (+2–5%) · ฟอร์มถูกสำคัญกว่าน้ำหนัก</li>
    <li>นอน 7–8 ชั่วโมง · คาเฟอีนมื้อสุดท้ายก่อน 14:00</li>
    <li>สแกน Evolt สัปดาห์ที่ 4, 8, 12 · เวลาเดียวกัน ท้องว่าง ไม่ใช่หลังมื้อใหญ่</li>
  </ul><p class="rnote">ค่าทั้งหมดเป็นการประมาณจากสูตรมาตรฐาน ไม่ใช่คำแนะนำทางการแพทย์ · ผู้มีโรคประจำตัวควรปรึกษาแพทย์</p>`));
  return `<div class="rdoc" id="rdoc">${out.join("")}<div class="rfoot">Blueprint Coach · ${esc(p.name||"")} · ${td}</div></div>`;
}
function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); }
async function rasterPDF(root, onProg){
  if(!window.html2canvas) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  if(!window.jspdf) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  try{ await document.fonts.ready; }catch(e){}
  const { jsPDF } = window.jspdf;
  const pdf=new jsPDF({unit:"pt",format:"a4",compress:true});
  const PW=595.28, PH=841.89, M=34, CW=PW-2*M, FOOT=18, CH=PH-2*M-FOOT;
  let y=M, page=1;
  const secs=[...root.querySelectorAll(".rsec")];
  for(let i=0;i<secs.length;i++){
    onProg && onProg(i+1, secs.length);
    const cv=await window.html2canvas(secs[i],{scale:2,backgroundColor:"#ffffff",logging:false,useCORS:true});
    const ratio=CW/cv.width; let h=cv.height*ratio;
    if(h<=CH){ if(y+h>M+CH){ pdf.addPage(); page++; y=M; } pdf.addImage(cv.toDataURL("image/jpeg",.9),"JPEG",M,y,CW,h); y+=h; continue; }
    // tall section: slice across pages
    let sy=0; const pxPerPt=1/ratio;
    while(sy<cv.height){
      if(M+CH-y<80){ pdf.addPage(); page++; y=M; }
      const avail=(M+CH-y)*pxPerPt; const sh=Math.min(avail, cv.height-sy);
      const part=document.createElement("canvas"); part.width=cv.width; part.height=Math.ceil(sh);
      part.getContext("2d").drawImage(cv,0,sy,cv.width,sh,0,0,cv.width,sh);
      pdf.addImage(part.toDataURL("image/jpeg",.9),"JPEG",M,y,CW,sh*ratio); y+=sh*ratio; sy+=sh;
      if(sy<cv.height){ pdf.addPage(); page++; y=M; }
    }
  }
  const n=pdf.getNumberOfPages();
  for(let i=1;i<=n;i++){ pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(120); pdf.text(`Blueprint Coach  |  ${today()}  |  ${i} / ${n}`, PW/2, PH-16, {align:"center"}); }
  return pdf.output("blob");
}
async function exportPDF(){
  const R=$("#report"); const fname="Blueprint-Coach-Report-"+today()+".pdf";
  if(!window.claude){ // standalone: native print → Save as PDF (vector, selectable Thai text)
    R.innerHTML=`<div class="rbar"><button class="btn pri" data-act="printNow">บันทึกเป็น PDF / พิมพ์</button><button class="btn" data-act="closeReport">ปิด</button></div>`+reportHTML();
    R.className="on"; R.setAttribute("aria-hidden","false"); R.scrollTop=0; const z=Math.min(1,(window.innerWidth-12)/760); $("#rdoc").style.zoom=z; return;
  }
  const dl = await window.claude.use("downloads").catch(()=>null);
  R.innerHTML=reportHTML(); R.className="off";
  $("#modalRoot").innerHTML=`<div class="sheet-wrap"><div class="rprog" id="rprog" style="position:fixed;inset:auto 0 50%;background:#14213dee;padding:18px;z-index:70">กำลังสร้าง PDF…</div></div>`;
  try{
    const blob=await rasterPDF($("#rdoc"),(i,n)=>{ const e=$("#rprog"); if(e) e.textContent=`กำลังสร้าง PDF… ${i}/${n}`; });
    $("#modalRoot").innerHTML="";
    if(dl){ try{ await dl.save({filename:fname,data:blob}); S.importMsg="บันทึก PDF แล้ว"; }catch(e){ S.importMsg = e&&e.code==="declined" ? "ยกเลิกการบันทึก PDF" : "บันทึก PDF ไม่สำเร็จ ("+(e&&e.code||"error")+")"; } }
    else { const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),1000); S.importMsg="สร้าง PDF แล้ว"; }
  }catch(e){ $("#modalRoot").innerHTML=""; S.importMsg="สร้าง PDF ไม่สำเร็จ ต้องต่ออินเทอร์เน็ตครั้งแรก"; }
  R.innerHTML=""; R.className=""; render();
}
async function exportJSON(){
  const txt=JSON.stringify({app:"blueprint-coach",v:1,exported:new Date().toISOString(),profile:S.profile,picks:S.picks,days:S.days},null,1);
  const fname="blueprint-coach-backup-"+today()+".json";
  if(window.claude){ const dl=await window.claude.use("downloads").catch(()=>null);
    if(dl){ try{ await dl.save({filename:fname,data:txt}); S.importMsg="สำรองข้อมูลแล้ว ("+Object.keys(S.days).length+" วัน)"; }catch(e){ S.importMsg=e&&e.code==="declined"?"ยกเลิกการสำรอง":"สำรองไม่สำเร็จ"; } render(); return; } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"})); a.download=fname;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
  S.importMsg="สำรองข้อมูลแล้ว ("+Object.keys(S.days).length+" วัน)"; render();
}

/* ---------- render + events ---------- */
function render(){
  renderTabs();
  const v={today:vToday,food:vFood,train:vTrain,track:vTrack,me:vMe}[S.tab]();
  $("#view").innerHTML=v;
}
document.addEventListener("click", ev=>{
  const b=ev.target.closest("button,[data-close]"); if(!b) return;
  const ds=b.dataset;
  if(ds.close && (ev.target===b || b.tagName==="BUTTON")){ $("#modalRoot").innerHTML=""; return; }
  if(ds.tab){ S.tab=ds.tab; S.confirmReset=false; render(); window.scrollTo(0,0); return; }
  if(ds.goto){ S.tab=ds.goto; render(); window.scrollTo(0,0); return; }
  if(ds.chk){ const d=day(today()); d.chk={...(d.chk||{}), [ds.chk]:!(d.chk||{})[ds.chk]}; saveDay(today()); render(); return; }
  if(ds.dt){ S.dayType=ds.dt; render(); return; }
  if(ds.swap){ S.picks[ds.swap]=(S.picks[ds.swap]||0)+1; saveProfile(); render(); return; }
  if(ds.day){ S.trainSel=+ds.day; render(); return; }
  if(ds.howto){ howto(ds.howto); return; }
  if(ds.log){ S.logOpen[ds.log]=!S.logOpen[ds.log]; render(); return; }
  if(ds.savelog){ const k=ds.savelog, t=today(), last=lastLog(k,t); const sets=[];
    document.querySelectorAll(`[data-kg^="${k}:"]`).forEach(inp=>{ const s=+inp.dataset.kg.split(":")[1]; const rp=document.querySelector(`[data-rp="${k}:${s}"]`);
      const kg = inp.value!==""? +inp.value : (last?.sets?.[s]?.kg ?? null); const r = rp.value!==""? +rp.value : (last?.sets?.[s]?.r ?? null);
      if(kg!=null||r!=null) sets[s]={kg:kg??0, r:r??0}; });
    const d=day(t); d.lifts={...(d.lifts||{}), [k]:sets.filter(Boolean)}; S.logOpen[k]=false; saveDay(t); render(); return; }
  if(ds.act==="saveW"){ const v=parseFloat($("#qW").value); if(v>20&&v<400){ day(today()).w=v; saveDay(today()); render(); } return; }
  if(ds.act==="saveTrack"){ const d=$("#tD").value||today(); const w=parseFloat($("#tW").value), wa=parseFloat($("#tWa").value); const x=day(d);
    if(w>20&&w<400) x.w=w; else delete x.w; if(wa>30&&wa<250) x.waist=wa; else delete x.waist; S.trackDate=d; saveDay(d); render(); return; }
  if(ds.act==="export"){ exportJSON(); return; }
  if(ds.act==="pdf"){ exportPDF(); return; }
  if(ds.act==="printNow"){ document.body.classList.add("printing"); setTimeout(()=>{ window.print(); },50); return; }
  if(ds.act==="closeReport"){ const R=$("#report"); R.innerHTML=""; R.className=""; R.setAttribute("aria-hidden","true"); return; }
  if(ds.act==="import"){ $("#impFile").click(); return; }
  if(ds.act==="reset"){ S.confirmReset=true; render(); return; }
  if(ds.act==="resetNo"){ S.confirmReset=false; render(); return; }
  if(ds.act==="resetYes"){ const ks=Object.keys(S.days); S.days={}; S.confirmReset=false; saveLocal();
    if(online) ks.forEach(k=>DB.doc("data/users/"+UID+"/profile").collection("days").doc(k).delete().catch(()=>{})); render(); return; }
});
document.addEventListener("change", ev=>{
  const el=ev.target;
  if(el.id==="tD"){ S.trackDate=el.value; render(); return; }
  if(el.id==="impFile" && el.files && el.files[0]){ const fr=new FileReader();
    fr.onload=()=>{ try{ const j=JSON.parse(fr.result);
        if(!j || typeof j!=="object" || (!j.profile && !j.days)) throw 0;
        if(j.profile) S.profile={...DEFAULT_PROFILE,...j.profile};
        if(j.picks) S.picks={...j.picks};
        if(j.days && typeof j.days==="object") S.days={...S.days,...j.days};
        saveLocal();
        if(online){ DB.doc("data/users/"+UID+"/profile").set({profile:S.profile,picks:S.picks}).catch(syncErr);
          Object.keys(j.days||{}).forEach(k=>DB.doc("data/users/"+UID+"/profile").collection("days").doc(k).set(S.days[k]).catch(syncErr)); }
        S.importMsg="นำเข้าแล้ว ("+Object.keys(j.days||{}).length+" วัน)";
      }catch(e){ S.importMsg="ไฟล์ไม่ถูกต้อง"; } render(); };
    fr.readAsText(el.files[0]); return; }
  if(el.id && el.id.startsWith("p_")){
    const k=el.id.slice(2); let v=el.value;
    if(["age","height","weight","bf","waist","days","weeks","wheyP","wheyK","wheyServ","coffee"].includes(k)) v = v===""? (k==="bf"?null:S.profile[k]) : +v;
    if(k==="lactose"||k==="creatineLoad") v = el.value==="1";
    S.profile[k]=v; saveProfile(); render();
  }
});
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape"){ $("#modalRoot").innerHTML=""; const R=$("#report"); if(R.className==="on"){ R.innerHTML=""; R.className=""; } } });
window.addEventListener("afterprint", ()=>document.body.classList.remove("printing"));

loadLocal(); render(); connect();
})();
